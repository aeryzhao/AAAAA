<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>中国5A级景区大全</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#0f766e;
  --primary-dark:#134e4a;
  --accent:#d97706;
  --bg:#f7f5ef;
  --surface:#fffdf8;
  --surface-soft:#f0eee5;
  --text:#17211f;
  --text-light:#65736f;
  --muted:#8a7560;
  --border:#ded8ca;
  --ring:rgba(15,118,110,.22);
  --shadow:0 18px 45px rgba(32,39,37,.1);
  --shadow-soft:0 8px 24px rgba(32,39,37,.08);
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 15% 0,#e6f2ee 0,transparent 28%),linear-gradient(180deg,#fbfaf6 0,#f4f0e7 100%);color:var(--text);line-height:1.65}
button,input,select{font:inherit}
button,a,select{cursor:pointer}
:focus-visible{outline:3px solid var(--ring);outline-offset:3px}
.header{position:relative;overflow:hidden;color:#fff;padding:72px 24px 96px;text-align:left;background:linear-gradient(120deg,rgba(14,80,75,.9),rgba(32,79,60,.75)),url("images/丽江古城景区_2.JPG") center/cover}
.header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:120px;background:linear-gradient(180deg,transparent,rgba(247,245,239,.98))}
.hero-inner{position:relative;z-index:1;max-width:1180px;margin:0 auto}
.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;margin-bottom:18px;border:1px solid rgba(255,255,255,.32);border-radius:999px;background:rgba(255,255,255,.13);backdrop-filter:blur(10px);font-size:.82em;font-weight:700;letter-spacing:.08em}
.header h1{max-width:720px;font-size:clamp(2.1rem,5vw,4.8rem);line-height:1.05;margin-bottom:18px;letter-spacing:0;font-weight:800}
.header p{max-width:680px;color:rgba(255,255,255,.86);font-size:1.08em}
.stats-bar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;max-width:860px;margin-top:34px}
.stat-item{padding:16px 18px;border:1px solid rgba(255,255,255,.22);border-radius:8px;background:rgba(255,255,255,.12);backdrop-filter:blur(14px)}
.stat-num{font-size:1.65em;font-weight:800;line-height:1.1}
.stat-label{font-size:.82em;color:rgba(255,255,255,.76);margin-top:5px}
.container{position:relative;z-index:2;max-width:1400px;margin:-58px auto 0;padding:0 24px 28px}
.filters{background:rgba(255,253,248,.92);border:1px solid rgba(222,216,202,.8);border-radius:8px;padding:18px;box-shadow:var(--shadow);display:grid;grid-template-columns:repeat(3,minmax(160px,1fr)) minmax(260px,1.5fr);gap:14px;align-items:end;backdrop-filter:blur(18px)}
.filter-group{display:flex;flex-direction:column;gap:6px;min-width:0}
.filter-group label{font-size:.78em;color:var(--muted);font-weight:800;letter-spacing:.04em}
.filter-group select,.filter-group input{width:100%;height:44px;padding:0 13px;border:1px solid var(--border);border-radius:7px;font-size:.94em;color:var(--text);background:#fff;outline:none;transition:border-color .2s,box-shadow .2s,background .2s}
.filter-group select:hover,.filter-group input:hover{border-color:#b8ab96}
.filter-group select:focus,.filter-group input:focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--ring)}
.search-box{position:relative}
.search-box input{padding-left:40px}
.search-box::before{content:"";position:absolute;left:14px;bottom:14px;width:13px;height:13px;border:2px solid var(--primary);border-radius:50%;pointer-events:none}
.search-box::after{content:"";position:absolute;left:27px;bottom:12px;width:7px;height:2px;background:var(--primary);transform:rotate(45deg);border-radius:2px;pointer-events:none}
.view-switch{display:flex;gap:8px;margin:18px 0 0}
.view-btn{height:40px;padding:0 15px;border:1px solid var(--border);border-radius:7px;background:rgba(255,253,248,.88);color:var(--text-light);font-weight:800;box-shadow:var(--shadow-soft);transition:background .18s,color .18s,border-color .18s,transform .18s}
.view-btn:hover{transform:translateY(-1px);border-color:#b8ab96;color:var(--primary-dark)}
.view-btn.active{background:var(--primary);border-color:var(--primary);color:#fff}
.map-panel{display:none;margin-top:18px;background:rgba(255,253,248,.94);border:1px solid rgba(222,216,202,.86);border-radius:8px;box-shadow:var(--shadow);overflow:hidden}
.map-panel.active{display:block}
.map-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 15px;border-bottom:1px solid var(--border);background:rgba(240,238,229,.62)}
.map-summary{font-size:.9em;color:var(--text-light)}
.map-summary strong{color:var(--primary-dark)}
.map-controls{display:flex;gap:7px}
.map-control{width:36px;height:34px;border:1px solid var(--border);border-radius:7px;background:#fff;color:var(--primary-dark);font-size:1.05em;font-weight:900;line-height:1;transition:background .18s,border-color .18s,transform .18s}
.map-control:hover{background:#e5f5ef;border-color:#a8d5ca;transform:translateY(-1px)}
.map-stage{position:relative;height:640px;overflow:hidden;background:linear-gradient(180deg,#eef8f5 0,#f8f3e8 100%)}
.china-map{width:100%;height:100%;display:block;touch-action:none;user-select:none;cursor:grab}
.china-map.dragging{cursor:grabbing}
.map-grid{stroke:#c8d8d2;stroke-width:1;opacity:.42}
.map-outline{fill:#e9deca;stroke:#b9a984;stroke-width:2.2;filter:drop-shadow(0 12px 18px rgba(60,54,42,.12))}
.map-province{fill:#e9deca;stroke:#b9a984;stroke-width:1.05;vector-effect:non-scaling-stroke;transition:fill .18s,stroke .18s,opacity .18s}
.map-province:hover{fill:#e2d4bb;stroke:#8f7c56}
.map-province.active{fill:#dff3ee;stroke:#0f766e;stroke-width:1.8}
.map-island{fill:#eadfcc;stroke:#b9a984;stroke-width:1.4}
.map-label{font-size:14px;font-weight:800;fill:#8a7560;paint-order:stroke;stroke:#fffdf8;stroke-width:4px;stroke-linejoin:round}
.map-spot-label{font-size:10.5px;font-weight:800;fill:#23302d;paint-order:stroke;stroke:#fffdf8;stroke-width:3px;stroke-linejoin:round;pointer-events:auto;cursor:pointer;transition:fill .14s}
.map-spot-label:hover,.map-spot-label:focus{fill:#0f766e;outline:none}
.map-point{fill:#d97706;stroke:#fffdf8;stroke-width:1.8;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .14s,opacity .14s}
.map-point:hover,.map-point:focus,.map-point.hovered{fill:#0f766e;outline:none}
.map-point.fallback{fill:#7d8f89}
.map-point.selected{fill:#0f766e}
.map-tooltip{position:absolute;left:0;top:0;max-width:260px;padding:10px 12px;border-radius:7px;border:1px solid rgba(222,216,202,.92);background:rgba(255,253,248,.97);box-shadow:0 12px 28px rgba(32,39,37,.16);font-size:.86em;line-height:1.55;pointer-events:none;opacity:0;transform:translate(-50%,-110%);transition:opacity .12s}
.map-tooltip.active{opacity:1}
.map-tooltip strong{display:block;color:var(--primary-dark);font-size:1.02em;margin-bottom:2px}
.map-empty{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:18px 22px;border:1px dashed var(--border);border-radius:8px;background:rgba(255,253,248,.85);color:var(--text-light);font-weight:800;display:none}
.map-empty.active{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px;margin-top:22px}
.card{background:var(--surface);border:1px solid rgba(222,216,202,.86);border-radius:8px;overflow:hidden;box-shadow:var(--shadow-soft);transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;cursor:pointer;position:relative;display:flex;flex-direction:column;height:100%}
.card:hover{transform:translateY(-4px);box-shadow:0 22px 50px rgba(32,39,37,.14);border-color:#b9aa8f}
.card-img{height:210px;background-size:cover;background-position:center;position:relative;overflow:hidden}
.card-img::after{content:"";position:absolute;inset:auto 0 0;height:58%;background:linear-gradient(transparent,rgba(0,0,0,.58))}
.card-img img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
.card:hover .card-img img{transform:scale(1.04)}
.card-badge{position:absolute;top:12px;right:12px;background:rgba(255,253,248,.92);color:var(--primary-dark);padding:5px 10px;border-radius:999px;font-size:.74em;font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.card-body{padding:17px 18px 14px;flex:1}
.card-title{font-size:1.12em;font-weight:800;margin-bottom:10px;color:var(--text);line-height:1.35}
.card-meta{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.card-tag{display:inline-flex;align-items:center;min-height:24px;padding:3px 9px;border-radius:999px;font-size:.76em;font-weight:800;line-height:1}
.tag-province{background:#dff3ee;color:#0f5f59}
.tag-category{background:#fff1d6;color:#8a4b0f}
.tag-year{background:#ece7dc;color:#665240}
.card-desc{font-size:.9em;color:var(--text-light);line-height:1.78;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:4.8em}
.card-footer{margin-top:auto;padding:12px 18px;border-top:1px solid rgba(222,216,202,.72);display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;font-size:.82em;color:var(--text-light)}
.card-location{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(18,25,24,.62);z-index:1000;justify-content:center;align-items:center;padding:24px}
.modal-overlay.active{display:flex}
.modal{background:var(--surface);border-radius:8px;max-width:780px;width:100%;max-height:88vh;overflow-y:auto;position:relative;box-shadow:0 30px 90px rgba(0,0,0,.35)}
.modal-close{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.7);width:38px;height:38px;border-radius:999px;font-size:1.1em;cursor:pointer;z-index:3;display:flex;align-items:center;justify-content:center;color:#1f2927;transition:background .2s,transform .2s}
.modal-close:hover{background:#fff;transform:translateY(-1px)}
.modal-img{width:100%;height:340px;background-size:cover;background-position:center;position:relative;overflow:hidden}
.modal-img img{width:100%;height:100%;object-fit:cover}
.modal-gallery{position:relative;width:100%;height:340px;overflow:hidden;background:#111}
.modal-gallery img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.modal-gallery .gallery-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,253,248,.88);color:#1f2927;border:none;width:40px;height:40px;border-radius:999px;font-size:1.25em;cursor:pointer;z-index:2;display:flex;align-items:center;justify-content:center;transition:background .2s,transform .2s}
.modal-gallery .gallery-nav:hover{background:#fff;transform:translateY(-50%) scale(1.03)}
.modal-gallery .gallery-prev{left:14px}
.modal-gallery .gallery-next{right:14px}
.modal-gallery .gallery-dots{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:7px;z-index:2}
.modal-gallery .gallery-dots span{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.48);cursor:pointer;transition:background .2s,transform .2s}
.modal-gallery .gallery-dots span.active{background:#fff;transform:scale(1.25)}
.modal-gallery .gallery-caption{position:absolute;bottom:0;left:0;right:0;padding:28px 16px 10px;background:linear-gradient(transparent,rgba(0,0,0,.62));color:#fff;font-size:.82em;text-align:center}
.modal-body{padding:28px}
.modal-body h2{font-size:1.75em;line-height:1.25;margin-bottom:14px}
.modal-tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.modal-tags .card-tag{font-size:.82em;padding:5px 11px}
.modal-desc{font-size:.98em;line-height:1.9;color:var(--text);margin-bottom:18px}
.modal-info{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px;padding-top:18px;border-top:1px solid var(--border)}
.modal-info-item{padding:12px;border-radius:7px;background:var(--surface-soft);font-size:.9em}
.modal-info-item .label{color:var(--text-light);font-size:.82em;margin-bottom:3px}
.modal-info-item .value{font-weight:800}
.no-result{text-align:center;padding:72px 20px;color:var(--text-light);background:rgba(255,253,248,.68);border:1px dashed var(--border);border-radius:8px}
.no-result .icon{width:52px;height:52px;margin:0 auto 14px;border-radius:50%;background:linear-gradient(135deg,#dff3ee,#fff1d6);border:1px solid var(--border)}
.back-top{position:fixed;bottom:28px;right:28px;width:46px;height:46px;background:var(--primary);color:#fff;border:none;border-radius:999px;font-size:1.25em;cursor:pointer;box-shadow:0 12px 28px rgba(15,118,110,.28);display:none;align-items:center;justify-content:center;z-index:100;transition:background .2s,transform .2s}
.back-top:hover{background:var(--primary-dark);transform:translateY(-2px)}
.back-top.show{display:flex}
.pagination{display:flex;justify-content:center;gap:8px;margin-top:28px;flex-wrap:wrap}
.page-btn{min-width:42px;height:40px;padding:0 13px;border:1px solid var(--border);border-radius:7px;background:var(--surface);cursor:pointer;font-size:.9em;font-weight:700;color:var(--text-light);transition:background .2s,color .2s,border-color .2s}
.page-btn:hover,.page-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.page-btn:disabled{opacity:.45;cursor:default;background:var(--surface);color:var(--text-light);border-color:var(--border)}
.footer{text-align:center;padding:32px 20px;color:var(--text-light);font-size:.85em;margin-top:36px}
.modal-links{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;padding-top:18px;border-top:1px solid var(--border)}
.link-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 18px;border-radius:7px;font-size:.9em;font-weight:800;text-decoration:none;color:#fff;background:var(--primary);transition:background .18s,box-shadow .18s,transform .18s}
.link-btn:hover{background:var(--primary-dark);box-shadow:0 10px 22px rgba(15,118,110,.22);transform:translateY(-1px)}
.link-btn.map-btn{background:var(--accent)}
.link-btn.map-btn:hover{background:#b45309;box-shadow:0 10px 22px rgba(217,119,6,.22)}
.card-map-btn,.card-baike-btn{display:inline-flex;align-items:center;justify-content:center;min-height:30px;padding:0 11px;border-radius:999px;font-size:.78em;font-weight:800;text-decoration:none;transition:background .18s,border-color .18s,color .18s;cursor:pointer;white-space:nowrap}
.card-map-btn{color:#0f5f59;background:#e5f5ef;border:1px solid #b8dcd1}
.card-map-btn:hover{background:#d1eee4;border-color:#8ac6b6;color:#0b4a45}
.card-baike-btn{color:#7c4a03;background:#fff4da;border:1px solid #ead09c}
.card-baike-btn:hover{background:#fdecc2;border-color:#d8b46c;color:#623a02}
@media(max-width:960px){
  .filters{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stats-bar{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:768px){
  .header{padding:54px 18px 88px}
  .header p{font-size:1em}
  .container{margin-top:-50px;padding:0 16px 24px}
  .filters{grid-template-columns:1fr;padding:14px}
  .view-switch{display:grid;grid-template-columns:1fr 1fr}
  .map-toolbar{align-items:flex-start;flex-direction:column}
  .map-stage{height:520px}
  .grid{grid-template-columns:1fr;gap:16px;margin-top:18px}
  .card-img{height:205px}
  .card-footer{grid-template-columns:1fr auto}
  .modal-overlay{padding:12px}
  .modal-img,.modal-gallery{height:260px}
  .modal-body{padding:22px}
  .modal-info{grid-template-columns:1fr}
  .back-top{right:18px;bottom:18px}
}
@media(max-width:480px){
  .stats-bar{grid-template-columns:1fr 1fr;gap:8px}
  .stat-item{padding:12px}
  .stat-num{font-size:1.35em}
  .card-footer{font-size:.78em}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<div class="header">
  <div class="hero-inner">
    <div class="eyebrow">国家 AAAAA 旅游景区索引</div>
    <h1>中国5A级景区大全</h1>
    <p>收录中华人民共和国文化和旅游部评定的国家5A级旅游景区，按省份、类别和入选年份快速筛选浏览。</p>
    <div class="stats-bar">
      <div class="stat-item"><div class="stat-num" id="totalCount">0</div><div class="stat-label">景区总数</div></div>
      <div class="stat-item"><div class="stat-num" id="provinceCount">0</div><div class="stat-label">覆盖省份</div></div>
      <div class="stat-item"><div class="stat-num" id="categoryCount">0</div><div class="stat-label">景区类别</div></div>
      <div class="stat-item"><div class="stat-num" id="yearSpan">0</div><div class="stat-label">评选年份跨度</div></div>
    </div>
  </div>
</div>
<div class="container">
  <div class="filters">
    <div class="filter-group">
      <label>省份/地区</label>
      <select id="filterProvince"><option value="">全部省份</option></select>
    </div>
    <div class="filter-group">
      <label>景区类别</label>
      <select id="filterCategory"><option value="">全部类别</option></select>
    </div>
    <div class="filter-group">
      <label>入选时间</label>
      <select id="filterYear"><option value="">全部年份</option></select>
    </div>
    <div class="filter-group search-box">
      <label>搜索</label>
      <input type="text" id="searchInput" placeholder="搜索景区名称、地点...">
    </div>
  </div>
  <div class="view-switch" role="tablist" aria-label="浏览方式">
    <button class="view-btn active" id="listViewBtn" type="button" onclick="setView('list')" role="tab" aria-selected="true">列表</button>
    <button class="view-btn" id="mapViewBtn" type="button" onclick="setView('map')" role="tab" aria-selected="false">地图</button>
  </div>
  <section class="map-panel" id="mapPanel" aria-label="景区分布地图">
    <div class="map-toolbar">
      <div class="map-summary" id="mapSummary">地图加载中</div>
      <div class="map-controls" aria-label="地图缩放">
        <button class="map-control" type="button" onclick="zoomMap(.82)" aria-label="放大">+</button>
        <button class="map-control" type="button" onclick="zoomMap(1.22)" aria-label="缩小">−</button>
        <button class="map-control" type="button" onclick="fitMapToFiltered()" aria-label="重置地图">⌂</button>
      </div>
    </div>
    <div class="map-stage" id="mapStage">
      <svg class="china-map" id="chinaMap" viewBox="0 0 1000 640" role="img" aria-label="中国5A级景区大致分布图"></svg>
      <div class="map-tooltip" id="mapTooltip"></div>
      <div class="map-empty" id="mapEmpty">没有可显示的景区</div>
    </div>
  </section>
  <div class="grid" id="grid"></div>
  <div class="no-result" id="noResult" style="display:none"><div class="icon"></div><p>没有找到匹配的景区</p></div>
  <div class="pagination" id="pagination"></div>
</div>
<div class="modal-overlay" id="modal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-img" id="modalImg"></div>
    <div class="modal-body">
      <h2 id="modalTitle"></h2>
      <div class="modal-tags" id="modalTags"></div>
      <div class="modal-desc" id="modalDesc"></div>
      <div class="modal-info" id="modalInfo"></div>
      <div class="modal-links" id="modalLinks"></div>
    </div>
  </div>
</div>
<button class="back-top" id="backTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>
<div class="footer">数据来源：中华人民共和国文化和旅游部 | 截至2024年最新评定批次</div>

<script>
// --- Load local image mapping ---
let _imgMapping={};
let _baikeUrls={};
let _provinceGeo=null;
let spots=[];
let categories=[];
let provinces=[];
let years=[];

fetch('data/spots.json').then(r=>r.json()).then(d=>initializeSpotData(d)).catch(err=>{console.error('景区数据加载失败',err);render()});
fetch('images-mapping.json').then(r=>r.json()).then(d=>{_imgMapping=d;applyImgMapping();render()}).catch(()=>{});
fetch('baike-urls.json').then(r=>r.json()).then(d=>{_baikeUrls=d}).catch(()=>{});
fetch('data/china-provinces.json').then(r=>r.json()).then(d=>{_provinceGeo=d;if(currentView==='map')renderMap()}).catch(()=>{});

function initializeSpotData(data){
  spots=Array.isArray(data)?data:[];
  categories=[...new Set(spots.map(s=>s.category))].sort();
  provinces=[...new Set(spots.map(s=>s.province))].sort();
  years=[...new Set(spots.map(s=>s.year))].sort((a,b)=>b-a);
  populateFilterOptions();
  document.getElementById('totalCount').textContent=spots.length;
  document.getElementById('provinceCount').textContent=provinces.length;
  document.getElementById('categoryCount').textContent=categories.length;
  document.getElementById('yearSpan').textContent=years.length?years[years.length-1]+'-'+years[0]:'-';
  applyImgMapping();
  currentPage=1;
  render();
}

function populateFilterOptions(){
  filterProvince.innerHTML='<option value="">全部省份</option>';
  filterCategory.innerHTML='<option value="">全部类别</option>';
  filterYear.innerHTML='<option value="">全部年份</option>';
  provinces.forEach(p=>{const o=document.createElement('option');o.value=p;o.textContent=p;filterProvince.appendChild(o)});
  categories.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;filterCategory.appendChild(o)});
  years.forEach(y=>{const o=document.createElement('option');o.value=y;o.textContent=y+'年';filterYear.appendChild(o)});
}

function applyImgMapping(){
  spots.forEach(s=>{
    const imgs=_imgMapping[s.name];
    if(imgs&&imgs.length){
      s.imgs=imgs;
      s.img=imgs[0];
    }
  });
}

function getCanonicalCoord(spot){
  if(spot&&Number.isFinite(spot.lat)&&Number.isFinite(spot.lng)){
    return {
      lat:spot.lat,
      lng:spot.lng,
      source:spot.coordSource||'景区数据'
    };
  }
  return null;
}

const filterProvince=document.getElementById('filterProvince');
const filterCategory=document.getElementById('filterCategory');
const filterYear=document.getElementById('filterYear');
const searchInput=document.getElementById('searchInput');
const grid=document.getElementById('grid');
const noResult=document.getElementById('noResult');
const paginationEl=document.getElementById('pagination');
const listViewBtn=document.getElementById('listViewBtn');
const mapViewBtn=document.getElementById('mapViewBtn');
const mapPanel=document.getElementById('mapPanel');
const mapStage=document.getElementById('mapStage');
const chinaMap=document.getElementById('chinaMap');
const mapTooltip=document.getElementById('mapTooltip');
const mapSummary=document.getElementById('mapSummary');
const mapEmpty=document.getElementById('mapEmpty');


const ITEMS_PER_PAGE=20;
let currentPage=1;
let currentView='list';

const MAP_BASE_VIEW={x:0,y:0,w:1000,h:640};
const MAP_MIN_VIEW={w:45,h:32};
let mapView={...MAP_BASE_VIEW};
let mapDragging=false;
let mapDragStart=null;
const MAP_NS='http://www.w3.org/2000/svg';

function projectCoord(lng,lat){
  const x=(lng-73.2)/(135.2-73.2)*1000;
  const y=(53.8-lat)/(53.8-18.0)*640;
  return {x,y};
}

function getSpotCoord(spot){
  const coord=getCanonicalCoord(spot);
  if(!coord)return null;
  return {lng:coord.lng,lat:coord.lat,source:coord.source,estimated:false};
}

function getMapPoint(spot){
  const coord=getSpotCoord(spot);
  if(!coord)return null;
  const p=projectCoord(coord.lng,coord.lat);
  return {
    x:p.x,
    y:p.y,
    source:coord.source,
    estimated:coord.estimated
  };
}

function setView(view){
  currentView=view;
  const isMap=view==='map';
  listViewBtn.classList.toggle('active',!isMap);
  mapViewBtn.classList.toggle('active',isMap);
  listViewBtn.setAttribute('aria-selected',String(!isMap));
  mapViewBtn.setAttribute('aria-selected',String(isMap));
  mapPanel.classList.toggle('active',isMap);
  render();
  if(isMap)requestAnimationFrame(fitMapToFiltered);
}

function setMapViewBox(next){
  const maxW=1000,maxH=640;
  const w=Math.max(MAP_MIN_VIEW.w,Math.min(maxW,next.w));
  const h=Math.max(MAP_MIN_VIEW.h,Math.min(maxH,next.h));
  const x=Math.max(0,Math.min(maxW-w,next.x));
  const y=Math.max(0,Math.min(maxH-h,next.y));
  mapView={x,y,w,h};
  chinaMap.setAttribute('viewBox',`${x} ${y} ${w} ${h}`);
  updateMapPointSizes();
}

function zoomMap(factor,center){
  center=center||{x:mapView.x+mapView.w/2,y:mapView.y+mapView.h/2};
  const nw=Math.max(MAP_MIN_VIEW.w,Math.min(1000,mapView.w*factor));
  const nh=Math.max(MAP_MIN_VIEW.h,Math.min(640,mapView.h*factor));
  setMapViewBox({
    x:center.x-(center.x-mapView.x)*(nw/mapView.w),
    y:center.y-(center.y-mapView.y)*(nh/mapView.h),
    w:nw,h:nh
  });
}

function updateMapPointSizes(){
  if(!chinaMap)return;
  const pointScale=Math.max(mapView.w/1000,mapView.h/640);
  chinaMap.querySelectorAll('.map-point').forEach(point=>{
    const base=point.classList.contains('fallback')?4.9:4.4;
    point.setAttribute('r',Math.max(.35,base*pointScale).toFixed(2));
  });
  updateMapLabelSizes();
}

function updateMapLabelSizes(){
  const spotLabels=chinaMap.querySelectorAll('.map-spot-label');
  const regionLabels=chinaMap.querySelectorAll('.map-label');
  const zoom=Math.max(1000/mapView.w,640/mapView.h);
  const showLabels=zoom>=4;
  const offsetScale=Math.max(mapView.w/1000,mapView.h/640);
  const desiredSpotSize=9.8+Math.min(3.7,Math.max(0,(zoom-1.65)*.18));
  const spotFontSize=Math.max(.45,desiredSpotSize/zoom);
  const spotStrokeWidth=Math.max(.14,(2.4+Math.min(1.2,(zoom-1.65)*.05))/zoom);
  const regionFontSize=Math.max(.62,14/zoom);
  const regionStrokeWidth=Math.max(.2,2.8/zoom);

  regionLabels.forEach(label=>{
    label.style.fontSize=regionFontSize.toFixed(2)+'px';
    label.style.strokeWidth=regionStrokeWidth.toFixed(2)+'px';
  });

  spotLabels.forEach(label=>{
    label.style.display=showLabels?'':'none';
    if(!showLabels)return;
    const x=parseFloat(label.dataset.x);
    const y=parseFloat(label.dataset.y);
    const dx=parseFloat(label.dataset.dx);
    const dy=parseFloat(label.dataset.dy);
    label.setAttribute('x',(x+dx*offsetScale).toFixed(2));
    label.setAttribute('y',(y+dy*offsetScale).toFixed(2));
    label.style.fontSize=spotFontSize.toFixed(2)+'px';
    label.style.strokeWidth=spotStrokeWidth.toFixed(2)+'px';
  });
}

function fitMapToFiltered(){
  const points=getFiltered().map(getMapPoint).filter(Boolean);
  if(!points.length){setMapViewBox(MAP_BASE_VIEW);return}
  const xs=points.map(p=>p.x),ys=points.map(p=>p.y);
  const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  const pad=filterProvince.value?55:35;
  const w=Math.max(180,maxX-minX+pad*2);
  const h=Math.max(140,maxY-minY+pad*2);
  setMapViewBox({x:minX-pad,y:minY-pad,w,h});
}

function svgEl(tag,attrs){
  const el=document.createElementNS(MAP_NS,tag);
  Object.entries(attrs||{}).forEach(([k,v])=>el.setAttribute(k,v));
  return el;
}

function normalizeProvinceName(name){
  return name
    .replace(/特别行政区$/,'')
    .replace(/维吾尔自治区$/,'')
    .replace(/壮族自治区$/,'')
    .replace(/回族自治区$/,'')
    .replace(/自治区$/,'')
    .replace(/[省市]$/,'');
}

function ringToPath(ring){
  return ring.map(([lng,lat],i)=>{
    const p=projectCoord(lng,lat);
    return `${i?'L':'M'}${p.x.toFixed(2)} ${p.y.toFixed(2)}`;
  }).join(' ')+' Z';
}

function geometryToPath(geometry){
  const polygons=geometry.type==='Polygon'?[geometry.coordinates]:geometry.coordinates;
  return polygons.map(poly=>poly.map(ringToPath).join(' ')).join(' ');
}

function renderProvinceBoundaries(){
  if(!_provinceGeo)return false;
  const selected=filterProvince.value;
  const group=svgEl('g');
  _provinceGeo.features.forEach(feature=>{
    const name=normalizeProvinceName(feature.properties.name);
    const path=svgEl('path',{
      d:geometryToPath(feature.geometry),
      'class':'map-province '+(selected&&selected===name?'active':''),
      'data-province':name,
      'fill-rule':'evenodd'
    });
    group.appendChild(path);
  });
  chinaMap.appendChild(group);

  if(selected)return true;
  _provinceGeo.features.forEach(feature=>{
    const name=normalizeProvinceName(feature.properties.name);
    if(!provinces.includes(name)&&!['台湾'].includes(name))return;
    const center=feature.properties.centroid||feature.properties.center;
    if(!center)return;
    const p=projectCoord(center[0],center[1]);
    const t=svgEl('text',{'class':'map-label',x:p.x,y:p.y,'text-anchor':'middle'});
    t.textContent=name;
    chinaMap.appendChild(t);
  });
  return true;
}

function renderFallbackMapOutline(){
  const mainland=[[73.5,39.5],[76,42.5],[82,45.5],[88,48.2],[96,49.2],[104,48.5],[111,49.2],[119,50.3],[126,49.2],[132,47.5],[134,44.5],[131,42.2],[125,40.2],[122,38.8],[121,36.8],[123,34.6],[121,31.0],[119,28.5],[121,25.2],[118,23.0],[114,22.2],[110,20.3],[106,21.8],[102,22.0],[98,24.0],[97,27.5],[92,28.4],[88,29.8],[84,31.2],[80,33.0],[78,35.4],[74.8,36.8]];
  const outline=mainland.map(([lng,lat])=>{const p=projectCoord(lng,lat);return `${p.x.toFixed(1)},${p.y.toFixed(1)}`}).join(' ');
  chinaMap.appendChild(svgEl('polygon',{'class':'map-outline',points:outline}));
  [[110.2,19.2,28],[121,23.7,34],[114.17,22.32,8],[113.54,22.2,6]].forEach(([lng,lat,r])=>{
    const p=projectCoord(lng,lat);
    chinaMap.appendChild(svgEl('circle',{'class':'map-island',cx:p.x,cy:p.y,r}));
  });

  const labels=[['新疆',87.6,43.8],['西藏',91.1,31.2],['青海',97.3,35.6],['四川',103.8,30.7],['云南',101.8,25.1],['内蒙古',112.5,43.5],['东北',126.2,45.6],['华北',116.2,38.4],['华东',119.5,31.2],['华南',113.8,23.2]];
  labels.forEach(([text,lng,lat])=>{
    const p=projectCoord(lng,lat);
    const t=svgEl('text',{'class':'map-label',x:p.x,y:p.y,'text-anchor':'middle'});
    t.textContent=text;
    chinaMap.appendChild(t);
  });
}

function renderMap(){
  const filtered=getFiltered();
  const visible=filtered.map(s=>({spot:s,idx:spots.indexOf(s),point:getMapPoint(s)})).filter(v=>v.point);
  chinaMap.innerHTML='';

  const defs=svgEl('defs');
  const grid=svgEl('g',{'class':'map-grid'});
  for(let x=100;x<1000;x+=100)grid.appendChild(svgEl('line',{x1:x,y1:0,x2:x,y2:640}));
  for(let y=80;y<640;y+=80)grid.appendChild(svgEl('line',{x1:0,y1:y,x2:1000,y2:y}));
  chinaMap.appendChild(defs);
  chinaMap.appendChild(grid);

  if(!renderProvinceBoundaries())renderFallbackMapOutline();

  const pointGroup=svgEl('g');
  const labelGroup=svgEl('g');
  const labelOffsets=[[7,-7],[7,8],[-7,-7],[-7,8],[0,-12],[0,12]];
  const pointScale=Math.max(mapView.w/1000,mapView.h/640);
  visible.forEach(({spot,idx,point})=>{
    const radius=(point.estimated?4.9:4.4)*pointScale;
    const circle=svgEl('circle',{
      'class':'map-point '+(point.estimated?'fallback':''),
      cx:point.x.toFixed(2),
      cy:point.y.toFixed(2),
      r:Math.max(.35,radius).toFixed(2),
      tabindex:0,
      role:'button',
      'aria-label':spot.name
    });
    circle.addEventListener('mouseenter',e=>showMapTooltip(e,spot));
    circle.addEventListener('mousemove',e=>moveMapTooltip(e));
    circle.addEventListener('mouseleave',hideMapTooltip);
    circle.addEventListener('focus',e=>showMapTooltip(e,spot));
    circle.addEventListener('blur',hideMapTooltip);
    circle.addEventListener('click',e=>{e.stopPropagation();openModal(idx)});
    circle.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openModal(idx)}});
    pointGroup.appendChild(circle);

    const [dx,dy]=labelOffsets[idx%labelOffsets.length];
    const label=svgEl('text',{
      'class':'map-spot-label',
      x:(point.x+dx).toFixed(2),
      y:(point.y+dy).toFixed(2),
      'text-anchor':dx<0?'end':dx>0?'start':'middle'
    });
    label.dataset.x=point.x;
    label.dataset.y=point.y;
    label.dataset.dx=dx;
    label.dataset.dy=dy;
    label.setAttribute('tabindex','0');
    label.setAttribute('role','button');
    label.setAttribute('aria-label',spot.name);
    label.textContent=spot.name;
    label.addEventListener('mouseenter',e=>{circle.classList.add('hovered');showMapTooltip(e,spot)});
    label.addEventListener('mousemove',e=>moveMapTooltip(e));
    label.addEventListener('mouseleave',()=>{circle.classList.remove('hovered');hideMapTooltip()});
    label.addEventListener('focus',e=>{circle.classList.add('hovered');showMapTooltip(e,spot)});
    label.addEventListener('blur',()=>{circle.classList.remove('hovered');hideMapTooltip()});
    label.addEventListener('click',e=>{e.stopPropagation();openModal(idx)});
    label.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openModal(idx)}});
    labelGroup.appendChild(label);
  });
  chinaMap.appendChild(pointGroup);
  chinaMap.appendChild(labelGroup);
  updateMapPointSizes();

  const fallbackCount=visible.filter(v=>v.point.estimated).length;
  mapSummary.innerHTML=`显示 <strong>${visible.length}</strong> 个景区点位`+(fallbackCount?`，其中 <strong>${fallbackCount}</strong> 个为城市/省份估算位置`:'');
  mapEmpty.classList.toggle('active',visible.length===0);
}

function showMapTooltip(event,spot){
  mapTooltip.innerHTML=`<strong>${spot.name}</strong>${spot.province} · ${spot.city}<br>${spot.category} · ${spot.year}年入选<br>${spot.desc}`;
  mapTooltip.classList.add('active');
  moveMapTooltip(event);
}

function moveMapTooltip(event){
  const rect=mapStage.getBoundingClientRect();
  const clientX=event.clientX||(event.touches&&event.touches[0].clientX)||rect.left+rect.width/2;
  const clientY=event.clientY||(event.touches&&event.touches[0].clientY)||rect.top+rect.height/2;
  mapTooltip.style.left=(clientX-rect.left)+'px';
  mapTooltip.style.top=(clientY-rect.top)+'px';
}

function hideMapTooltip(){mapTooltip.classList.remove('active')}

function mapClientToSvg(event){
  const rect=chinaMap.getBoundingClientRect();
  return {
    x:mapView.x+(event.clientX-rect.left)/rect.width*mapView.w,
    y:mapView.y+(event.clientY-rect.top)/rect.height*mapView.h
  };
}

function getFiltered(){
  const pv=filterProvince.value,ct=filterCategory.value,yr=filterYear.value,sw=searchInput.value.trim().toLowerCase();
  return spots.filter(s=>{
    if(pv&&s.province!==pv)return false;
    if(ct&&s.category!==ct)return false;
    if(yr&&s.year!==parseInt(yr))return false;
    if(sw&&!s.name.toLowerCase().includes(sw)&&!s.city.toLowerCase().includes(sw)&&!s.province.toLowerCase().includes(sw)&&!s.desc.toLowerCase().includes(sw))return false;
    return true;
  });
}

const imgColors=['#e8d5b7','#b7d5e8','#d5e8b7','#e8b7d5','#b7e8d5','#d5b7e8','#c5d8e8','#e8c5b7','#b7c5e8','#e8e5b7'];
function getImgBg(spot){
  const idx=(spot.name.charCodeAt(0)+spot.name.length)%imgColors.length;
  return `linear-gradient(135deg,${imgColors[idx]},${imgColors[(idx+3)%imgColors.length]})`;
}

function getAmapUrl(spot){
  const coord=getCanonicalCoord(spot);
  if(coord){
    return `https://uri.amap.com/marker?position=${coord.lng},${coord.lat}&name=${encodeURIComponent(spot.name)}`;
  }
  return `https://uri.amap.com/search?keyword=${encodeURIComponent(spot.name+' '+spot.city)}`;
}

function renderCard(spot,i){
  const idx=spots.indexOf(spot);
  const imgHtml=spot.img
    ? `<img src="${spot.img}" alt="${spot.name}" loading="lazy" onerror="this.style.display='none'">`
    : '';
  return `<div class="card" onclick="openModal(${idx})" role="button" tabindex="0" aria-label="查看${spot.name}详情" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openModal(${idx})}">
    <div class="card-img" style="background:${getImgBg(spot)}">${imgHtml}</div>
    <div class="card-badge">${spot.year}年入选</div>
    <div class="card-body">
      <div class="card-title">${spot.name}</div>
      <div class="card-meta">
        <span class="card-tag tag-province">${spot.province}</span>
        <span class="card-tag tag-category">${spot.category}</span>
      </div>
      <div class="card-desc">${spot.desc}</div>
    </div>
    <div class="card-footer">
      <span class="card-location">${spot.province} · ${spot.city}</span>
      <a class="card-map-btn" href="${getAmapUrl(spot)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" aria-label="在高德地图打开${spot.name}">地图</a>
      <a class="card-baike-btn" href="https://baike.baidu.com/item/${encodeURIComponent(_baikeUrls[spot.name]||spot.name)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" aria-label="在百度百科打开${spot.name}">百科</a>
    </div>
  </div>`;
}

function render(){
  const filtered=getFiltered();
  const totalPages=Math.ceil(filtered.length/ITEMS_PER_PAGE);
  if(currentPage>totalPages)currentPage=1;
  const start=(currentPage-1)*ITEMS_PER_PAGE;
  const pageItems=filtered.slice(start,start+ITEMS_PER_PAGE);
  const isList=currentView==='list';

  grid.innerHTML=pageItems.map(renderCard).join('');
  grid.style.display=isList?'grid':'none';
  noResult.style.display=isList&&!filtered.length?'block':'none';

  let pg='';
  if(totalPages>1){
    pg+=`<button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>上一页</button>`;
    for(let i=1;i<=totalPages;i++){
      if(i===1||i===totalPages||(i>=currentPage-2&&i<=currentPage+2)){
        pg+=`<button class="page-btn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
      }else if(i===currentPage-3||i===currentPage+3){
        pg+='<span style="padding:8px">...</span>';
      }
    }
    pg+=`<button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage===totalPages?'disabled':''}>下一页</button>`;
  }
  paginationEl.innerHTML=pg;
  paginationEl.style.display=isList?'flex':'none';
  if(currentView==='map')renderMap();
}

function goPage(p){currentPage=p;render();window.scrollTo({top:300,behavior:'smooth'})}

let _galleryState={imgs:[],cur:0};

function openModal(idx){
  const s=spots[idx];
  const coord=getCanonicalCoord(s);
  const modalImgEl=document.getElementById('modalImg');
  // Use local gallery if available
  if(s.imgs&&s.imgs.length>1){
    _galleryState={imgs:s.imgs,cur:0};
    _renderGallery(s.name);
  }else if(s.img){
    modalImgEl.innerHTML=`<img src="${s.img}" alt="${s.name}">`;
    modalImgEl.style.background='#111';
  }else{
    modalImgEl.style.background=getImgBg(s);
    modalImgEl.innerHTML='';
  }
  modalImgEl.style.display='';
  document.getElementById('modalTitle').textContent=s.name;
  document.getElementById('modalTags').innerHTML=`<span class="card-tag tag-province">${s.province}</span><span class="card-tag tag-category">${s.category}</span><span class="card-tag tag-year">${s.year}年入选</span>`;
  document.getElementById('modalDesc').textContent=s.desc;
  document.getElementById('modalInfo').innerHTML=`
    <div class="modal-info-item"><div class="label">所在省份</div><div class="value">${s.province}</div></div>
    <div class="modal-info-item"><div class="label">所在城市</div><div class="value">${s.city}</div></div>
    <div class="modal-info-item"><div class="label">景区类别</div><div class="value">${s.category}</div></div>
    <div class="modal-info-item"><div class="label">入选年份</div><div class="value">${s.year}年</div></div>
    <div class="modal-info-item"><div class="label">地理坐标</div><div class="value">${coord?`${coord.lat}°N, ${coord.lng}°E`:'—'}</div></div>
    <div class="modal-info-item"><div class="label">景区级别</div><div class="value">国家AAAAA级</div></div>`;
  document.getElementById('modalLinks').innerHTML=`<a class="link-btn" href="https://baike.baidu.com/item/${encodeURIComponent(_baikeUrls[s.name]||s.name)}" target="_blank" rel="noopener">百度百科</a>
    <a class="link-btn map-btn" href="${getAmapUrl(s)}" target="_blank" rel="noopener">高德地图</a>`;
  document.getElementById('modal').classList.add('active');
  document.body.style.overflow='hidden';
}

function _renderGallery(name){
  const el=document.getElementById('modalImg');
  const g=_galleryState;
  if(!g.imgs.length)return;
  el.innerHTML=`<div class="modal-gallery">
    <img src="${g.imgs[g.cur]}" alt="${name}">
    ${g.imgs.length>1?`<button class="gallery-nav gallery-prev" onclick="event.stopPropagation();_galleryNav(-1)">‹</button>
    <button class="gallery-nav gallery-next" onclick="event.stopPropagation();_galleryNav(1)">›</button>
    <div class="gallery-dots">${g.imgs.map((_,i)=>`<span class="${i===g.cur?'active':''}" onclick="event.stopPropagation();_galleryGo(${i})"></span>`).join('')}</div>`:''}
    <div class="gallery-caption">${g.cur+1} / ${g.imgs.length}</div>
  </div>`;
  el.style.background='#111';
}

function _galleryNav(dir){
  const g=_galleryState;
  g.cur=(g.cur+dir+g.imgs.length)%g.imgs.length;
  _renderGallery(document.getElementById('modalTitle').textContent);
}
function _galleryGo(i){
  _galleryState.cur=i;
  _renderGallery(document.getElementById('modalTitle').textContent);
}

function closeModal(){document.getElementById('modal').classList.remove('active');document.body.style.overflow=''}
document.getElementById('modal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

let timer;function debounce(fn,delay){return function(){clearTimeout(timer);timer=setTimeout(fn,delay)}}

function onFiltersChanged(){
  currentPage=1;
  render();
  if(currentView==='map')requestAnimationFrame(fitMapToFiltered);
}

filterProvince.addEventListener('change',onFiltersChanged);
filterCategory.addEventListener('change',onFiltersChanged);
filterYear.addEventListener('change',onFiltersChanged);
searchInput.addEventListener('input',debounce(onFiltersChanged,300));

setMapViewBox(MAP_BASE_VIEW);
chinaMap.addEventListener('wheel',e=>{
  e.preventDefault();
  const center=mapClientToSvg(e);
  zoomMap(e.deltaY < 0 ? .86 : 1.16,center);
},{passive:false});
chinaMap.addEventListener('pointerdown',e=>{
  if(e.target.classList.contains('map-point')||e.target.classList.contains('map-spot-label'))return;
  mapDragging=true;
  chinaMap.classList.add('dragging');
  chinaMap.setPointerCapture(e.pointerId);
  mapDragStart={clientX:e.clientX,clientY:e.clientY,view:{...mapView}};
});
chinaMap.addEventListener('pointermove',e=>{
  if(!mapDragging||!mapDragStart)return;
  const rect=chinaMap.getBoundingClientRect();
  const dx=(e.clientX-mapDragStart.clientX)/rect.width*mapDragStart.view.w;
  const dy=(e.clientY-mapDragStart.clientY)/rect.height*mapDragStart.view.h;
  setMapViewBox({...mapDragStart.view,x:mapDragStart.view.x-dx,y:mapDragStart.view.y-dy});
});
chinaMap.addEventListener('pointerup',e=>{
  mapDragging=false;
  mapDragStart=null;
  chinaMap.classList.remove('dragging');
  if(chinaMap.hasPointerCapture(e.pointerId))chinaMap.releasePointerCapture(e.pointerId);
});
chinaMap.addEventListener('pointercancel',()=>{
  mapDragging=false;
  mapDragStart=null;
  chinaMap.classList.remove('dragging');
});

window.addEventListener('scroll',()=>{document.getElementById('backTop').classList.toggle('show',window.scrollY>400)});

render();
</script>
</body>
</html>
