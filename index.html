<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国5A级景区大全</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#0f766e;
  --primary-dark:#134e4a;
  --accent:#d97706;
  --bg:#f7f5ef;
  --surface:#fffdf8;
  --surface-soft:#f0eee5;
  --text:#17211f;
  --text-light:#65736f;
  --muted:#8a7560;
  --border:#ded8ca;
  --ring:rgba(15,118,110,.22);
  --shadow:0 18px 45px rgba(32,39,37,.1);
  --shadow-soft:0 8px 24px rgba(32,39,37,.08);
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 15% 0,#e6f2ee 0,transparent 28%),linear-gradient(180deg,#fbfaf6 0,#f4f0e7 100%);color:var(--text);line-height:1.65}
button,input,select{font:inherit}
button,a,select{cursor:pointer}
:focus-visible{outline:3px solid var(--ring);outline-offset:3px}
.header{position:relative;overflow:hidden;color:#fff;padding:72px 24px 96px;text-align:left;background:linear-gradient(120deg,rgba(14,80,75,.9),rgba(32,79,60,.75)),url("images/丽江古城景区_2.JPG") center/cover}
.header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:120px;background:linear-gradient(180deg,transparent,rgba(247,245,239,.98))}
.hero-inner{position:relative;z-index:1;max-width:1180px;margin:0 auto}
.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;margin-bottom:18px;border:1px solid rgba(255,255,255,.32);border-radius:999px;background:rgba(255,255,255,.13);backdrop-filter:blur(10px);font-size:.82em;font-weight:700;letter-spacing:.08em}
.header h1{max-width:720px;font-size:clamp(2.1rem,5vw,4.8rem);line-height:1.05;margin-bottom:18px;letter-spacing:0;font-weight:800}
.header p{max-width:680px;color:rgba(255,255,255,.86);font-size:1.08em}
.stats-bar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;max-width:860px;margin-top:34px}
.stat-item{padding:16px 18px;border:1px solid rgba(255,255,255,.22);border-radius:8px;background:rgba(255,255,255,.12);backdrop-filter:blur(14px)}
.stat-num{font-size:1.65em;font-weight:800;line-height:1.1}
.stat-label{font-size:.82em;color:rgba(255,255,255,.76);margin-top:5px}
.container{position:relative;z-index:2;max-width:1400px;margin:-58px auto 0;padding:0 24px 28px}
.filters{background:rgba(255,253,248,.92);border:1px solid rgba(222,216,202,.8);border-radius:8px;padding:18px;box-shadow:var(--shadow);display:grid;grid-template-columns:repeat(3,minmax(160px,1fr)) minmax(260px,1.5fr);gap:14px;align-items:end;backdrop-filter:blur(18px)}
.filter-group{display:flex;flex-direction:column;gap:6px;min-width:0}
.filter-group label{font-size:.78em;color:var(--muted);font-weight:800;letter-spacing:.04em}
.filter-group select,.filter-group input{width:100%;height:44px;padding:0 13px;border:1px solid var(--border);border-radius:7px;font-size:.94em;color:var(--text);background:#fff;outline:none;transition:border-color .2s,box-shadow .2s,background .2s}
.filter-group select:hover,.filter-group input:hover{border-color:#b8ab96}
.filter-group select:focus,.filter-group input:focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--ring)}
.search-box{position:relative}
.search-box input{padding-left:40px}
.search-box::before{content:"";position:absolute;left:14px;bottom:14px;width:13px;height:13px;border:2px solid var(--primary);border-radius:50%;pointer-events:none}
.search-box::after{content:"";position:absolute;left:27px;bottom:12px;width:7px;height:2px;background:var(--primary);transform:rotate(45deg);border-radius:2px;pointer-events:none}
.result-info{display:flex;align-items:center;justify-content:space-between;margin:22px 0 16px;color:var(--text-light);font-size:.94em}
.result-info strong{color:var(--primary-dark);font-size:1.1em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}
.card{background:var(--surface);border:1px solid rgba(222,216,202,.86);border-radius:8px;overflow:hidden;box-shadow:var(--shadow-soft);transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;cursor:pointer;position:relative;display:flex;flex-direction:column;height:100%}
.card:hover{transform:translateY(-4px);box-shadow:0 22px 50px rgba(32,39,37,.14);border-color:#b9aa8f}
.card-img{height:210px;background-size:cover;background-position:center;position:relative;overflow:hidden}
.card-img::after{content:"";position:absolute;inset:auto 0 0;height:58%;background:linear-gradient(transparent,rgba(0,0,0,.58))}
.card-img img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
.card:hover .card-img img{transform:scale(1.04)}
.card-badge{position:absolute;top:12px;right:12px;background:rgba(255,253,248,.92);color:var(--primary-dark);padding:5px 10px;border-radius:999px;font-size:.74em;font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.card-body{padding:17px 18px 14px;flex:1}
.card-title{font-size:1.12em;font-weight:800;margin-bottom:10px;color:var(--text);line-height:1.35}
.card-meta{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.card-tag{display:inline-flex;align-items:center;min-height:24px;padding:3px 9px;border-radius:999px;font-size:.76em;font-weight:800;line-height:1}
.tag-province{background:#dff3ee;color:#0f5f59}
.tag-category{background:#fff1d6;color:#8a4b0f}
.tag-year{background:#ece7dc;color:#665240}
.card-desc{font-size:.9em;color:var(--text-light);line-height:1.78;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:4.8em}
.card-footer{margin-top:auto;padding:12px 18px;border-top:1px solid rgba(222,216,202,.72);display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;font-size:.82em;color:var(--text-light)}
.card-location{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(18,25,24,.62);z-index:1000;justify-content:center;align-items:center;padding:24px}
.modal-overlay.active{display:flex}
.modal{background:var(--surface);border-radius:8px;max-width:780px;width:100%;max-height:88vh;overflow-y:auto;position:relative;box-shadow:0 30px 90px rgba(0,0,0,.35)}
.modal-close{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.7);width:38px;height:38px;border-radius:999px;font-size:1.1em;cursor:pointer;z-index:3;display:flex;align-items:center;justify-content:center;color:#1f2927;transition:background .2s,transform .2s}
.modal-close:hover{background:#fff;transform:translateY(-1px)}
.modal-img{width:100%;height:340px;background-size:cover;background-position:center;position:relative;overflow:hidden}
.modal-img img{width:100%;height:100%;object-fit:cover}
.modal-gallery{position:relative;width:100%;height:340px;overflow:hidden;background:#111}
.modal-gallery img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.modal-gallery .gallery-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,253,248,.88);color:#1f2927;border:none;width:40px;height:40px;border-radius:999px;font-size:1.25em;cursor:pointer;z-index:2;display:flex;align-items:center;justify-content:center;transition:background .2s,transform .2s}
.modal-gallery .gallery-nav:hover{background:#fff;transform:translateY(-50%) scale(1.03)}
.modal-gallery .gallery-prev{left:14px}
.modal-gallery .gallery-next{right:14px}
.modal-gallery .gallery-dots{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:7px;z-index:2}
.modal-gallery .gallery-dots span{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.48);cursor:pointer;transition:background .2s,transform .2s}
.modal-gallery .gallery-dots span.active{background:#fff;transform:scale(1.25)}
.modal-gallery .gallery-caption{position:absolute;bottom:0;left:0;right:0;padding:28px 16px 10px;background:linear-gradient(transparent,rgba(0,0,0,.62));color:#fff;font-size:.82em;text-align:center}
.modal-body{padding:28px}
.modal-body h2{font-size:1.75em;line-height:1.25;margin-bottom:14px}
.modal-tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.modal-tags .card-tag{font-size:.82em;padding:5px 11px}
.modal-desc{font-size:.98em;line-height:1.9;color:var(--text);margin-bottom:18px}
.modal-info{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px;padding-top:18px;border-top:1px solid var(--border)}
.modal-info-item{padding:12px;border-radius:7px;background:var(--surface-soft);font-size:.9em}
.modal-info-item .label{color:var(--text-light);font-size:.82em;margin-bottom:3px}
.modal-info-item .value{font-weight:800}
.no-result{text-align:center;padding:72px 20px;color:var(--text-light);background:rgba(255,253,248,.68);border:1px dashed var(--border);border-radius:8px}
.no-result .icon{width:52px;height:52px;margin:0 auto 14px;border-radius:50%;background:linear-gradient(135deg,#dff3ee,#fff1d6);border:1px solid var(--border)}
.back-top{position:fixed;bottom:28px;right:28px;width:46px;height:46px;background:var(--primary);color:#fff;border:none;border-radius:999px;font-size:1.25em;cursor:pointer;box-shadow:0 12px 28px rgba(15,118,110,.28);display:none;align-items:center;justify-content:center;z-index:100;transition:background .2s,transform .2s}
.back-top:hover{background:var(--primary-dark);transform:translateY(-2px)}
.back-top.show{display:flex}
.pagination{display:flex;justify-content:center;gap:8px;margin-top:28px;flex-wrap:wrap}
.page-btn{min-width:42px;height:40px;padding:0 13px;border:1px solid var(--border);border-radius:7px;background:var(--surface);cursor:pointer;font-size:.9em;font-weight:700;color:var(--text-light);transition:background .2s,color .2s,border-color .2s}
.page-btn:hover,.page-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.page-btn:disabled{opacity:.45;cursor:default;background:var(--surface);color:var(--text-light);border-color:var(--border)}
.footer{text-align:center;padding:32px 20px;color:var(--text-light);font-size:.85em;margin-top:36px}
.modal-links{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;padding-top:18px;border-top:1px solid var(--border)}
.link-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 18px;border-radius:7px;font-size:.9em;font-weight:800;text-decoration:none;color:#fff;background:var(--primary);transition:background .18s,box-shadow .18s,transform .18s}
.link-btn:hover{background:var(--primary-dark);box-shadow:0 10px 22px rgba(15,118,110,.22);transform:translateY(-1px)}
.link-btn.map-btn{background:var(--accent)}
.link-btn.map-btn:hover{background:#b45309;box-shadow:0 10px 22px rgba(217,119,6,.22)}
.card-map-btn,.card-baike-btn{display:inline-flex;align-items:center;justify-content:center;min-height:30px;padding:0 11px;border-radius:999px;font-size:.78em;font-weight:800;text-decoration:none;transition:background .18s,border-color .18s,color .18s;cursor:pointer;white-space:nowrap}
.card-map-btn{color:#0f5f59;background:#e5f5ef;border:1px solid #b8dcd1}
.card-map-btn:hover{background:#d1eee4;border-color:#8ac6b6;color:#0b4a45}
.card-baike-btn{color:#7c4a03;background:#fff4da;border:1px solid #ead09c}
.card-baike-btn:hover{background:#fdecc2;border-color:#d8b46c;color:#623a02}
@media(max-width:960px){
  .filters{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stats-bar{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:768px){
  .header{padding:54px 18px 88px}
  .header p{font-size:1em}
  .container{margin-top:-50px;padding:0 16px 24px}
  .filters{grid-template-columns:1fr;padding:14px}
  .grid{grid-template-columns:1fr;gap:16px}
  .card-img{height:205px}
  .card-footer{grid-template-columns:1fr auto}
  .modal-overlay{padding:12px}
  .modal-img,.modal-gallery{height:260px}
  .modal-body{padding:22px}
  .modal-info{grid-template-columns:1fr}
  .back-top{right:18px;bottom:18px}
}
@media(max-width:480px){
  .stats-bar{grid-template-columns:1fr 1fr;gap:8px}
  .stat-item{padding:12px}
  .stat-num{font-size:1.35em}
  .card-footer{font-size:.78em}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<div class="header">
  <div class="hero-inner">
    <div class="eyebrow">国家 AAAAA 旅游景区索引</div>
    <h1>中国5A级景区大全</h1>
    <p>收录中华人民共和国文化和旅游部评定的国家5A级旅游景区，按省份、类别和入选年份快速筛选浏览。</p>
    <div class="stats-bar">
      <div class="stat-item"><div class="stat-num" id="totalCount">0</div><div class="stat-label">景区总数</div></div>
      <div class="stat-item"><div class="stat-num" id="provinceCount">0</div><div class="stat-label">覆盖省份</div></div>
      <div class="stat-item"><div class="stat-num" id="categoryCount">0</div><div class="stat-label">景区类别</div></div>
      <div class="stat-item"><div class="stat-num" id="yearSpan">0</div><div class="stat-label">评选年份跨度</div></div>
    </div>
  </div>
</div>
<div class="container">
  <div class="filters">
    <div class="filter-group">
      <label>省份/地区</label>
      <select id="filterProvince"><option value="">全部省份</option></select>
    </div>
    <div class="filter-group">
      <label>景区类别</label>
      <select id="filterCategory"><option value="">全部类别</option></select>
    </div>
    <div class="filter-group">
      <label>入选时间</label>
      <select id="filterYear"><option value="">全部年份</option></select>
    </div>
    <div class="filter-group search-box">
      <label>搜索</label>
      <input type="text" id="searchInput" placeholder="搜索景区名称、地点...">
    </div>
  </div>
  <div class="result-info" id="resultInfo"></div>
  <div class="grid" id="grid"></div>
  <div class="no-result" id="noResult" style="display:none"><div class="icon"></div><p>没有找到匹配的景区</p></div>
  <div class="pagination" id="pagination"></div>
</div>
<div class="modal-overlay" id="modal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-img" id="modalImg"></div>
    <div class="modal-body">
      <h2 id="modalTitle"></h2>
      <div class="modal-tags" id="modalTags"></div>
      <div class="modal-desc" id="modalDesc"></div>
      <div class="modal-info" id="modalInfo"></div>
      <div class="modal-links" id="modalLinks"></div>
    </div>
  </div>
</div>
<button class="back-top" id="backTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>
<div class="footer">数据来源：中华人民共和国文化和旅游部 | 截至2024年最新评定批次</div>

<script>
// --- Load local image mapping ---
let _imgMapping={};
let _baikeUrls={};
fetch('images-mapping.json').then(r=>r.json()).then(d=>{_imgMapping=d;applyImgMapping();render()}).catch(()=>{});
fetch('baike-urls.json').then(r=>r.json()).then(d=>{_baikeUrls=d}).catch(()=>{});

function applyImgMapping(){
  spots.forEach(s=>{
    const imgs=_imgMapping[s.name];
    if(imgs&&imgs.length){
      s.imgs=imgs;
      s.img=imgs[0];
    }
  });
}

const spots=[{name: "故宫博物院", province: "北京", city: "北京", year: 2007, category: "文化遗产", desc: "世界上现存规模最大、保存最为完整的木质结构古建筑群，是明清两代皇家宫殿，旧称紫禁城。占地面积约72万平方米，建筑面积约15万平方米，有大小宫殿七十多座，房屋九千余间。", lat: 39.916, lng: 116.397}, {name: "天坛公园", province: "北京", city: "北京", year: 2007, category: "文化遗产", desc: "明清两代帝王祭天、祈谷的场所，是中国现存最大的祭祀建筑群。主体建筑祈年殿是中国古代建筑艺术的杰作，整个建筑群体现了中国古代宇宙观念。", lat: 39.882, lng: 116.407}, {name: "颐和园", province: "北京", city: "北京", year: 2007, category: "文化遗产", desc: "中国现存最大的皇家园林，以昆明湖、万寿山为基址，以杭州西湖为蓝本，汲取江南园林的设计手法而建成。被誉为“皇家园林博物馆”。", lat: 39.999, lng: 116.275}, {name: "八达岭-慕田峪长城旅游区", province: "北京", city: "北京", year: 2007, category: "文化遗产", desc: "北京北京国家5A级旅游景区。"}, {name: "明十三陵景区", province: "北京", city: "北京", year: 2011, category: "文化遗产", desc: "北京北京国家5A级旅游景区。"}, {name: "恭王府景区", province: "北京", city: "北京", year: 2012, category: "文化遗产", desc: "清代规模最大的王府，曾先后作为和珅、永璘的宅邸。恭王府历经清王朝由鼎盛至衰亡的历史进程，故有“一座恭王府，半部清代史”的说法。", lat: 39.933, lng: 116.384}, {name: "北京奥林匹克公园", province: "北京", city: "北京", year: 2012, category: "现代建筑", desc: "2008年北京奥运会的主场馆区，包含鸟巢（国家体育场）、水立方（国家游泳中心）等标志性建筑，是集体育、文化、休闲于一体的综合性公园。", lat: 39.993, lng: 116.39}, {name: "圆明园遗址公园", province: "北京", city: "北京", year: 2019, category: "文化遗产", desc: "清代大型皇家园林，由圆明园、长春园和绮春园组成，被誉为“万园之园”。1860年遭英法联军焚毁，现为遗址公园和爱国主义教育基地。", lat: 39.999, lng: 116.304}, {name: "北京大运河文化旅游景区", province: "北京", city: "通州", year: 2024, category: "文化遗产", desc: "大运河北京段沿线文化遗产，以大运河文化为主题，展现千年运河的历史风貌。"}, {name: "天津古文化街旅游区", province: "天津", city: "天津", year: 2007, category: "文化遗产", desc: "天津卫发祥地，以天后宫为中心，集古文化、民俗、商业于一体。"}, {name: "盘山风景名胜区", province: "天津", city: "蓟州", year: 2007, category: "自然风光", desc: "位于天津市蓟州区，有“京东第一山”之誉。盘山景色以“五峰八石”、“三盘之胜”而著称，集幽林、古洞、奇峰、秀水于一身。", lat: 40.078, lng: 117.445}, {name: "承德避暑山庄及周围寺庙景区", province: "河北", city: "承德", year: 2007, category: "文化遗产", desc: "河北承德国家5A级旅游景区。"}, {name: "保定白洋淀景区", province: "河北", city: "保定", year: 2007, category: "自然风光", desc: "华北平原最大的淡水湖泊，有“北国江南”之称。抗战时期“雁翎队”的故事发生地，荷花芦苇构成独特水乡风光。", lat: 38.872, lng: 115.97}, {name: "秦皇岛山海关景区", province: "河北", city: "秦皇岛", year: 2007, category: "文化遗产", desc: "明长城东部的重要关隘，有“天下第一关”之称。山海关城东门是明长城东端的起点，与万里之外的嘉峪关遥相呼应。", lat: 39.958, lng: 119.757}, {name: "保定野三坡景区", province: "河北", city: "保定", year: 2011, category: "自然风光", desc: "位于太行山脉和燕山山脉交汇处，以“雄、险、奇、幽”的自然景观闻名。景区有百里峡、龙门天关、鱼谷洞等多个景点。", lat: 39.683, lng: 115.353}, {name: "石家庄西柏坡景区", province: "河北", city: "石家庄", year: 2011, category: "红色旅游", desc: "中国革命的圣地，曾是中共中央所在地。党中央在此指挥了辽沈、淮海、平津三大战役，召开了具有伟大历史意义的七届二中全会。", lat: 38.356, lng: 113.987}, {name: "唐山清东陵景区", province: "河北", city: "唐山", year: 2015, category: "文化遗产", desc: "中国现存规模最宏大、体系最完整、布局最得体的帝王陵墓建筑群之一。埋葬着5位皇帝、15位皇后等共161人。", lat: 40.183, lng: 117.64}, {name: "邯郸娲皇宫景区", province: "河北", city: "邯郸", year: 2015, category: "文化遗产", desc: "中国规模最大、肇建时间最早的祀奉女娲的古建筑群。始建于北齐，依山就势而建，被誉为“华夏祖庙”。", lat: 36.594, lng: 113.695}, {name: "保定白石山景区", province: "河北", city: "保定", year: 2017, category: "自然风光", desc: "位于河北省涞源县，以大理岩峰林地貌著称。主峰海拔2096米，有“北方小黄山”之称。玻璃栈道为全国之最。", lat: 39.358, lng: 114.689}, {name: "邯郸广府古城景区", province: "河北", city: "邯郸", year: 2017, category: "文化遗产", desc: "中国北方唯一的旱地水城和太极之乡，杨氏太极拳和武氏太极拳发源地。"}, {name: "保定清西陵景区", province: "河北", city: "保定", year: 2019, category: "文化遗产", desc: "清朝雍正、嘉庆、道光、光绪四位皇帝及后妃的陵寝所在地。陵区内松柏苍翠，古建宏伟，是中国保存最完整的皇家陵寝群之一。", lat: 39.15, lng: 115.316}, {name: "承德金山岭长城景区", province: "河北", city: "承德", year: 2020, category: "文化遗产", desc: "万里长城最精华的一段，以视野开阔、敌楼密集著称。"}, {name: "唐山南湖·开滦旅游景区", province: "河北", city: "唐山", year: 2024, category: "现代建筑", desc: "由采煤沉降区改造而成的城市生态公园，唐山生态转型典范。"}, {name: "衡水湖旅游景区", province: "河北", city: "衡水", year: 2024, category: "自然风光", desc: "华北平原唯一保持完整生态系统的淡水湿地。"}, {name: "大同云冈石窟", province: "山西", city: "大同", year: 2007, category: "文化遗产", desc: "中国规模最大的古代石窟群之一，始凿于北魏时期。现存主要洞窟45个，大小窟龛252个，石雕造像51000余躯，为中国规模最大的古代石窟群之一。", lat: 40.107, lng: 113.128}, {name: "忻州五台山风景名胜区", province: "山西", city: "忻州", year: 2007, category: "文化遗产", desc: "中国佛教四大名山之首，文殊菩萨的道场。五台山寺院林立，现存完整寺院47处，以佛光寺和南禅寺的大殿为中国现存最古老的木结构建筑。", lat: 39.085, lng: 113.592}, {name: "晋城皇城相府生态文化旅游区", province: "山西", city: "晋城", year: 2011, category: "文化遗产", desc: "清文渊阁大学士兼吏部尚书陈廷敬的故居，是集明清两代城堡式建筑群于一体的官宦宅居古建筑群。", lat: 35.473, lng: 112.832}, {name: "晋中绵山风景区", province: "山西", city: "晋中", year: 2013, category: "自然风光", desc: "中国清明节发源地，以介子推的故事闻名。"}, {name: "晋中平遥古城", province: "山西", city: "晋中", year: 2015, category: "文化遗产", desc: "中国保存最为完好的四大古城之一，始建于西周宣王时期。古城较为完好地保留着明清时期的基本风貌，是中国古代城市的活样本。", lat: 37.189, lng: 112.175}, {name: "忻州雁门关景区", province: "山西", city: "忻州", year: 2017, category: "文化遗产", desc: "中华第一关，位于中国山西省忻州市代县县城以北约20公里处的雁门山中。是长城上的重要关隘，以“险”著称。", lat: 39.174, lng: 112.85}, {name: "临汾洪洞大槐树寻根祭祖园", province: "山西", city: "临汾", year: 2018, category: "文化遗产", desc: "全国以“寻根”和“祭祖”为主题的唯一民祭圣地。明初大移民的历史记忆，“问我祖先在何处，山西洪洞大槐树”。", lat: 36.253, lng: 111.676}, {name: "长治太行山大峡谷八泉峡景区", province: "山西", city: "长治", year: 2019, category: "自然风光", desc: "山西长治国家5A级旅游景区。"}, {name: "临汾云丘山景区", province: "山西", city: "临汾", year: 2020, category: "自然风光", desc: "位于临汾市乡宁县，以奇峰、怪石、清溪、溶洞著称。云丘山拥有国内最大规模的冰洞群，被称为“河汾第一名胜”。", lat: 35.963, lng: 110.854}, {name: "黄河壶口瀑布旅游区", province: "山西", city: "临汾", year: 2022, category: "自然风光", desc: "黄河由300米宽骤缩为50米，千里黄河一壶收的壮丽景象。"}, {name: "太原晋祠天龙山景区", province: "山西", city: "太原", year: 2024, category: "文化遗产", desc: "晋祠是中国现存最早的皇家园林，天龙山石窟以精美佛教造像著称。"}, {name: "晋中乔家大院景区", province: "山西", city: "晋中", year: 2024, category: "文化遗产", desc: "清代商业金融资本家乔致庸的宅院，北方民居建筑明珠。"}, {name: "鄂尔多斯响沙湾景区", province: "内蒙古", city: "鄂尔多斯", year: 2011, category: "自然风光", desc: "中国最大的沙漠旅游区，因沙子会发出轰鸣声而得名。银肯响沙居中国各响沙之首，被誉为“响沙之王”。", lat: 40.244, lng: 109.689}, {name: "鄂尔多斯成吉思汗陵旅游区", province: "内蒙古", city: "鄂尔多斯", year: 2011, category: "文化遗产", desc: "成吉思汗的衣冠冢，是蒙古族祭祀成吉思汗灵魂的地方。陵园占地约5.5公顷，建筑雄伟，具有浓郁的蒙古族特色。", lat: 39.372, lng: 109.86}, {name: "呼伦贝尔中俄边境旅游区", province: "内蒙古", city: "呼伦贝尔", year: 2016, category: "边境风情", desc: "内蒙古呼伦贝尔国家5A级旅游景区。"}, {name: "兴安盟阿尔山-柴河旅游景区", province: "内蒙古", city: "兴安盟", year: 2017, category: "自然风光", desc: "内蒙古兴安盟国家5A级旅游景区。"}, {name: "赤峰阿斯哈图石林景区", province: "内蒙古", city: "赤峰", year: 2018, category: "自然风光", desc: "世界罕见的花岗岩石林地貌。"}, {name: "阿拉善盟胡杨林旅游区", province: "内蒙古", city: "阿拉善盟", year: 2019, category: "自然风光", desc: "世界仅存三大胡杨林之一，总面积约26000公顷。每到金秋时节，胡杨林一片金黄，蔚为壮观，被誉为“最美胡杨林”。", lat: 41.96, lng: 101.064}, {name: "呼伦贝尔大草原·莫尔格勒河景区", province: "内蒙古", city: "呼伦贝尔", year: 2024, category: "自然风光", desc: "天下第一曲水莫尔格勒河蜿蜒于呼伦贝尔大草原。"}, {name: "呼和浩特老牛湾黄河大峡谷旅游区", province: "内蒙古", city: "呼和浩特", year: 2024, category: "自然风光", desc: "黄河入晋第一湾，壮美的黄河峡谷和古朴的黄河人家。"}, {name: "沈阳植物园", province: "辽宁", city: "沈阳", year: 2007, category: "园林景观", desc: "中国最大的城市植物园之一，占地面积约211公顷。园内汇集了国内外数千种植物，有百合塔、凤凰广场等标志性建筑。", lat: 41.856, lng: 123.612}, {name: "大连老虎滩海洋公园·极地馆", province: "辽宁", city: "大连", year: 2007, category: "主题乐园", desc: "辽宁大连国家5A级旅游景区。"}, {name: "大连金石滩景区", province: "辽宁", city: "大连", year: 2011, category: "自然风光", desc: "集地质奇观、海滨风光、主题于一体的综合旅游区。"}, {name: "本溪水洞景区", province: "辽宁", city: "本溪", year: 2015, category: "自然风光", desc: "世界最长的地下充水溶洞，已探明的地下暗河全长3000余米。洞内钟乳石形态各异，泛舟其中如入仙境。", lat: 41.298, lng: 123.76}, {name: "鞍山千山风景名胜区", province: "辽宁", city: "鞍山", year: 2017, category: "自然风光", desc: "位于辽宁省鞍山市东南，为长白山支脉。千山有“无峰不奇，无石不峭，无庙不古”之誉，以奇峰、岩松、古庙、梨花为四绝。", lat: 41.017, lng: 123.078}, {name: "盘锦红海滩风景廊道景区", province: "辽宁", city: "盘锦", year: 2019, category: "自然风光", desc: "辽宁盘锦国家5A级旅游景区。"}, {name: "本溪五女山景区", province: "辽宁", city: "本溪", year: 2024, category: "文化遗产", desc: "高句丽开国都城遗址，世界文化遗产。"}, {name: "长白山景区", province: "吉林", city: "延边", year: 2007, category: "自然风光", desc: "中朝两国的界山，中华十大名山之一。长白山天池是中国最高、最深、最大的火山口湖，松花江、鸭绿江、图们江的发源地。", lat: 42.021, lng: 128.056}, {name: "长春伪满皇宫博物院", province: "吉林", city: "长春", year: 2007, category: "文化遗产", desc: "清朝末代皇帝爱新觉罗·溥仪充当伪满洲国傀儡皇帝时的宫殿。是中国比较完整的宫廷遗址之一。", lat: 43.898, lng: 125.343}, {name: "长春净月潭景区", province: "吉林", city: "长春", year: 2011, category: "自然风光", desc: "亚洲最大的人工森林，因形似弯月而得名。"}, {name: "延边敦化六鼎山文化旅游区", province: "吉林", city: "敦化", year: 2015, category: "文化遗产", desc: "位于长白山腹地，以金鼎大佛和佛教文化为核心。金鼎大佛高48米，是世界上最大的释迦牟尼佛坐像之一。", lat: 43.372, lng: 128.235}, {name: "长春长影世纪城景区", province: "吉林", city: "长春", year: 2015, category: "主题乐园", desc: "中国第一家世界级电影主题娱乐园。"}, {name: "长春世界雕塑园", province: "吉林", city: "长春", year: 2017, category: "园林景观", desc: "世界上最大的建于城市中的雕塑公园。汇集了来自216个国家和地区的400多位雕塑家的439件作品。", lat: 43.827, lng: 125.298}, {name: "通化高句丽文物古迹旅游景区", province: "吉林", city: "通化", year: 2019, category: "文化遗产", desc: "世界文化遗产，以高句丽王城、王陵和贵族墓葬为主体。"}, {name: "松原查干湖景区", province: "吉林", city: "松原", year: 2024, category: "自然风光", desc: "中国十大淡水湖之一，冬季冰雪渔猎文化节闻名全国。"}, {name: "白城大安嫩江湾旅游区", province: "吉林", city: "白城", year: 2024, category: "自然风光", desc: "嫩江流入吉林的第一个湾，以湿地风光和辽金文化著称。"}, {name: "哈尔滨太阳岛景区", province: "黑龙江", city: "哈尔滨", year: 2007, category: "自然风光", desc: "位于松花江北岸，是哈尔滨的标志性景区。冬季的太阳岛国际雪雕艺术博览会闻名遐迩。", lat: 45.788, lng: 126.598}, {name: "牡丹江镜泊湖景区", province: "黑龙江", city: "牡丹江", year: 2011, category: "自然风光", desc: "中国最大、世界第二大的高山堰塞湖。吊水楼瀑布是镜泊湖最著名的景观，湖光山色美不胜收。", lat: 44.054, lng: 128.898}, {name: "黑河五大连池景区", province: "黑龙江", city: "黑河", year: 2011, category: "自然风光", desc: "世界地质公园，以火山地貌和矿泉资源闻名。由14座新老期火山喷发形成5个串珠状湖泊，被誉为“天然火山博物馆”。", lat: 48.74, lng: 126.145}, {name: "伊春林海奇石景区", province: "黑龙江", city: "伊春", year: 2013, category: "自然风光", desc: "黑龙江伊春国家5A级旅游景区。"}, {name: "大兴安岭北极村旅游景区", province: "黑龙江", city: "漠河", year: 2015, category: "自然风光", desc: "黑龙江漠河国家5A级旅游景区。"}, {name: "鸡西虎头旅游景区", province: "黑龙江", city: "鸡西", year: 2019, category: "自然风光", desc: "黑龙江鸡西国家5A级旅游景区。"}, {name: "齐齐哈尔扎龙生态旅游区", province: "黑龙江", city: "齐齐哈尔", year: 2024, category: "自然风光", desc: "中国最大的以鹤类为主的珍稀水禽自然保护区，丹顶鹤故乡。"}, {name: "东方明珠广播电视塔", province: "上海", city: "上海", year: 2007, category: "现代建筑", desc: "上海上海国家5A级旅游景区。"}, {name: "上海野生动物园", province: "上海", city: "上海", year: 2007, category: "主题乐园", desc: "中国首座国家级野生动物园，汇集了世界各地代表性动物200余种、上万余头（只）。", lat: 31.058, lng: 121.727}, {name: "上海科技馆", province: "上海", city: "上海", year: 2010, category: "博物馆", desc: "中国重要的科普教育基地，设有地壳探秘、生物万象、智慧之光等11个主题展区，拥有IMAX球幕影院。", lat: 31.219, lng: 121.539}, {name: "中共一大·二大·四大纪念馆景区", province: "上海", city: "上海", year: 2021, category: "红色旅游", desc: "上海上海国家5A级旅游景区。"}, {name: "西沙明珠湖景区", province: "上海", city: "上海", year: 2024, category: "自然风光", desc: "位于崇明岛，以湖泊湿地生态为核心。"}, {name: "苏州园林（拙政园·留园·虎丘）", province: "江苏", city: "苏州", year: 2007, category: "文化遗产", desc: "中国古典园林的代表，拙政园是苏州最大的古典园林，留园以建筑布局精巧著称，虎丘有“吴中第一名胜”之誉。", lat: 31.325, lng: 120.629}, {name: "苏州周庄古镇景区", province: "江苏", city: "苏州", year: 2007, category: "文化遗产", desc: "中国第一水乡，始建于1086年。镇内保存了大量明清建筑，以沈厅、张厅最为著名，“小桥流水人家”的典型江南水乡。", lat: 31.115, lng: 120.848}, {name: "南京钟山风景名胜区-中山陵园风景区", province: "江苏", city: "南京", year: 2007, category: "文化遗产", desc: "包含中山陵、明孝陵、灵谷寺等众多名胜古迹。中山陵是孙中山先生的陵墓，明孝陵是明太祖朱元璋的陵墓。", lat: 32.058, lng: 118.844}, {name: "无锡影视基地三国水浒城景区", province: "江苏", city: "无锡", year: 2007, category: "主题乐园", desc: "中央电视台为拍摄《三国演义》和《水浒传》而建的影视基地。依山傍水，景色秀丽。", lat: 31.468, lng: 120.114}, {name: "无锡灵山大佛景区", province: "江苏", city: "无锡", year: 2009, category: "文化遗产", desc: "灵山大佛高88米，世界最高露天青铜释迦牟尼立像。"}, {name: "苏州同里古镇景区", province: "江苏", city: "苏州", year: 2010, category: "文化遗产", desc: "江南六大古镇之一，始建于宋代。镇内家家临水，户户通舟，以退思园最为著名，被列入世界文化遗产。", lat: 31.151, lng: 120.717}, {name: "南京夫子庙-秦淮风光带", province: "江苏", city: "南京", year: 2010, category: "文化遗产", desc: "以夫子庙古建筑群为中心，以十里内秦淮河为轴线。集古迹、园林、画舫、市街和民俗于一体。", lat: 32.021, lng: 118.786}, {name: "常州环球恐龙城休闲旅游区", province: "江苏", city: "常州", year: 2010, category: "主题乐园", desc: "中国最大的恐龙主题乐园，集恐龙谷温泉、恐龙城大剧场、迪诺水镇等于一体。", lat: 31.823, lng: 119.974}, {name: "扬州瘦西湖风景区", province: "江苏", city: "扬州", year: 2010, category: "自然风光", desc: "“两堤花柳全依水，一路楼台直到山”的湖上园林。瘦西湖以“瘦”为特征，是扬州雍容华贵的象征。", lat: 32.414, lng: 119.424}, {name: "南通濠河风景区", province: "江苏", city: "南通", year: 2012, category: "自然风光", desc: "国内保存最完整的古护城河之一，全长约10公里。濠河环绕南通老城区，被誉为“城市的翡翠项链”。", lat: 32.018, lng: 120.856}, {name: "泰州溱湖旅游景区", province: "江苏", city: "泰州", year: 2012, category: "自然风光", desc: "以溱湖为主体的湿地公园，溱潼会船节闻名。"}, {name: "苏州金鸡湖景区", province: "江苏", city: "苏州", year: 2012, category: "现代建筑", desc: "中国最大的城市湖泊公园，以现代都市风貌著称。"}, {name: "镇江三山景区（金山·焦山·北固山）", province: "江苏", city: "镇江", year: 2012, category: "自然风光", desc: "金山以“水漫金山”的传说闻名，焦山以碑林著称，北固山以甘露寺为胜，三山遥相呼应。", lat: 32.224, lng: 119.416}, {name: "无锡鼋头渚景区", province: "江苏", city: "无锡", year: 2012, category: "自然风光", desc: "太湖风景名胜区的精华所在，有“太湖第一名胜”之称。鼋头渚樱花谷是中国最大的樱花观赏地之一。", lat: 31.514, lng: 120.216}, {name: "苏州吴中太湖旅游区", province: "江苏", city: "苏州", year: 2013, category: "自然风光", desc: "以太湖山水为主体，包含东山、西山、光福等景区。碧螺春茶的原产地，太湖风光的精华所在。", lat: 31.189, lng: 120.398}, {name: "苏州沙家浜·虞山尚湖旅游区", province: "江苏", city: "苏州", year: 2013, category: "自然风光", desc: "沙家浜以芦苇荡闻名，因京剧《沙家浜》而名扬天下。虞山尚湖以山水相依著称。", lat: 31.553, lng: 120.842}, {name: "常州天目湖景区", province: "江苏", city: "常州", year: 2013, category: "自然风光", desc: "江苏常州国家5A级旅游景区。"}, {name: "镇江茅山景区", province: "江苏", city: "镇江", year: 2014, category: "文化遗产", desc: "江苏镇江国家5A级旅游景区。"}, {name: "淮安周恩来故里景区", province: "江苏", city: "淮安", year: 2015, category: "红色旅游", desc: "江苏淮安国家5A级旅游景区。"}, {name: "盐城中华麋鹿园景区", province: "江苏", city: "盐城", year: 2015, category: "自然风光", desc: "江苏盐城国家5A级旅游景区。"}, {name: "徐州云龙湖景区", province: "江苏", city: "徐州", year: 2016, category: "自然风光", desc: "江苏徐州国家5A级旅游景区。"}, {name: "连云港花果山景区", province: "江苏", city: "连云港", year: 2016, category: "自然风光", desc: "《西游记》中花果山的原型，有“东海第一胜境”之称。主峰玉女峰海拔624.4米，是江苏省最高峰。", lat: 34.627, lng: 119.28}, {name: "常州春秋淹城旅游区", province: "江苏", city: "常州", year: 2017, category: "文化遗产", desc: "中国最古老最完整的地面城池遗址，建于春秋时期。"}, {name: "无锡惠山古镇景区", province: "江苏", city: "无锡", year: 2019, category: "文化遗产", desc: "以祠堂文化为核心的江南古镇，保存118处古祠堂。"}, {name: "宿迁洪泽湖湿地景区", province: "江苏", city: "宿迁", year: 2020, category: "自然风光", desc: "中国第四大淡水湖洪泽湖的湿地保护区。"}, {name: "连云港连岛景区", province: "江苏", city: "连云港", year: 2024, category: "自然风光", desc: "江苏省最大的海岛。"}, {name: "杭州西湖风景名胜区", province: "浙江", city: "杭州", year: 2007, category: "自然风光", desc: "“欲把西湖比西子，淡妆浓抹总相宜”。西湖是中国十大风景名胜之一，以“一山、二塔、三岛、三堤、五湖”为基本格局。", lat: 30.242, lng: 120.149}, {name: "温州雁荡山风景名胜区", province: "浙江", city: "温州", year: 2007, category: "自然风光", desc: "中国十大名山之一，以奇峰怪石、古洞石室、飞瀑流泉著称。素有“海上名山”、“寰中绝胜”之誉。", lat: 28.38, lng: 121.064}, {name: "舟山普陀山风景名胜区", province: "浙江", city: "舟山", year: 2007, category: "文化遗产", desc: "中国佛教四大名山之一，观音菩萨的道场。普陀山四面环海，以“海天佛国”著称。", lat: 30.006, lng: 122.381}, {name: "杭州千岛湖风景名胜区", province: "浙江", city: "杭州", year: 2010, category: "自然风光", desc: "为建设新安江水电站拦蓄而成的人工湖，拥有1078个翠岛。湖水清澈，水质达国家一级标准，被誉为“天下第一秀水”。", lat: 29.606, lng: 118.947}, {name: "嘉兴乌镇古镇旅游区", province: "浙江", city: "嘉兴", year: 2010, category: "文化遗产", desc: "浙江嘉兴国家5A级旅游景区。"}, {name: "宁波溪口-滕头旅游景区", province: "浙江", city: "宁波", year: 2010, category: "文化遗产", desc: "溪口是蒋介石的故里，有蒋氏故居等民国历史遗迹。滕头是全球生态500佳，以生态农业闻名。", lat: 29.686, lng: 121.281}, {name: "金华横店影视城景区", province: "浙江", city: "金华", year: 2010, category: "主题乐园", desc: "亚洲最大的影视拍摄基地，被称为“中国好莱坞”。建有秦王宫、清明上河图、明清宫苑等跨越千年的影视拍摄场景。", lat: 29.156, lng: 120.307}, {name: "嘉兴南湖旅游区", province: "浙江", city: "嘉兴", year: 2011, category: "红色旅游", desc: "中共一大的闭幕地，中国共产党的诞生地。南湖红船是中国共产党梦想起航的地方。", lat: 30.751, lng: 120.752}, {name: "杭州西溪湿地旅游区", province: "浙江", city: "杭州", year: 2012, category: "自然风光", desc: "中国首个国家湿地公园，一曲溪流一曲烟。"}, {name: "绍兴鲁迅故里·沈园景区", province: "浙江", city: "绍兴", year: 2012, category: "文化遗产", desc: "鲁迅先生诞生和少年时期生活的地方。沈园是宋代著名园林，因陆游与唐婉的爱情故事闻名。", lat: 30.003, lng: 120.581}, {name: "衢州根宫佛国文化旅游区", province: "浙江", city: "衢州", year: 2013, category: "文化遗产", desc: "浙江衢州国家5A级旅游景区。"}, {name: "湖州南浔古镇景区", province: "浙江", city: "湖州", year: 2015, category: "文化遗产", desc: "中国历史文化名镇，素有“文化之邦”、“诗书之乡”之称。南浔古镇以丝绸业闻名，中西合璧的建筑独具特色。", lat: 30.869, lng: 120.424}, {name: "台州天台山景区", province: "浙江", city: "台州", year: 2015, category: "文化遗产", desc: "佛教天台宗的发源地，道教南宗的祖庭。国清寺是中国佛教天台宗的根本道场。", lat: 29.176, lng: 121.039}, {name: "台州神仙居景区", province: "浙江", city: "台州", year: 2015, category: "自然风光", desc: "以火山流纹岩地貌为特色，有“神仙居之奇，在于峰奇、石奇、洞奇”之说。如意桥是世界最大高空悬挑玻璃桥。", lat: 28.834, lng: 120.637}, {name: "嘉兴西塘古镇旅游景区", province: "浙江", city: "嘉兴", year: 2017, category: "文化遗产", desc: "生活着的千年古镇，以廊棚和古弄著称。"}, {name: "衢州江郎山·廿八都旅游区", province: "浙江", city: "衢州", year: 2017, category: "自然风光", desc: "江郎山以三爿石著称，廿八都是保存完好的古驿站。"}, {name: "宁波天一阁·月湖景区", province: "浙江", city: "宁波", year: 2018, category: "文化遗产", desc: "天一阁是中国现存最古老的私人藏书楼。"}, {name: "丽水缙云仙都景区", province: "浙江", city: "丽水", year: 2019, category: "自然风光", desc: "以峰岩奇绝、山水神秀为特色。鼎湖峰高170.8米，被誉为“天下第一峰”，是轩辕黄帝炼丹升天之地。", lat: 28.658, lng: 120.091}, {name: "温州刘伯温故里景区", province: "浙江", city: "温州", year: 2020, category: "文化遗产", desc: "明朝开国元勋刘伯温的故乡。"}, {name: "台州台州府城文化旅游区", province: "浙江", city: "台州", year: 2022, category: "文化遗产", desc: "以江南长城和紫阳古街闻名。"}, {name: "丽水云和梯田景区", province: "浙江", city: "丽水", year: 2024, category: "自然风光", desc: "拥有1000多年历史的梯田群，跨越高山、丘谷三个梯度。云雾缭绕中层层叠叠的梯田如诗如画。", lat: 28.118, lng: 119.568}, {name: "金华双龙风景旅游区", province: "浙江", city: "金华", year: 2024, category: "自然风光", desc: "以双龙洞为代表的溶洞景区，卧舟入洞为全国独有。"}, {name: "黄山风景区", province: "安徽", city: "黄山", year: 2007, category: "自然风光", desc: "安徽黄山国家5A级旅游景区。"}, {name: "池州九华山风景区", province: "安徽", city: "池州", year: 2007, category: "文化遗产", desc: "中国佛教四大名山之一，地藏菩萨的道场。九华山以佛教文化和自然美景著称，现存古寺庙99座。", lat: 30.478, lng: 117.801}, {name: "安庆天柱山风景区", province: "安徽", city: "安庆", year: 2011, category: "自然风光", desc: "古称皖山，安徽省简称皖由此而来。"}, {name: "黄山皖南古村落（西递·宏村）", province: "安徽", city: "黄山", year: 2011, category: "文化遗产", desc: "安徽黄山国家5A级旅游景区。"}, {name: "六安天堂寨旅游景区", province: "安徽", city: "六安", year: 2012, category: "自然风光", desc: "位于大别山腹地，有“植物的王国、动物的乐园、圣水的故乡”之称。主峰天堂寨海拔1729.13米。", lat: 31.064, lng: 115.817}, {name: "宣城绩溪龙川景区", province: "安徽", city: "宣城", year: 2012, category: "文化遗产", desc: "胡姓聚族而居的古村落，已有一千六百余年历史。龙川胡氏宗祠被誉为“江南第一祠”。", lat: 30.067, lng: 118.584}, {name: "阜阳八里河景区", province: "安徽", city: "阜阳", year: 2013, category: "自然风光", desc: "位于淮河中游南岸，是皖北平原上的一颗明珠。景区由“世界风光”、“锦绣中华”、“碧波游览”等区域组成。", lat: 32.632, lng: 116.275}, {name: "黄山古徽州文化旅游区", province: "安徽", city: "黄山", year: 2014, category: "文化遗产", desc: "以徽州古城、棠樾牌坊群为代表，集中展示徽文化。"}, {name: "合肥三河古镇景区", province: "安徽", city: "合肥", year: 2015, category: "文化遗产", desc: "中国历史文化名镇，距今已有2500多年历史。因丰乐河、杭埠河、小南河三水流贯其间而得名。", lat: 31.506, lng: 117.262}, {name: "芜湖方特旅游区", province: "安徽", city: "芜湖", year: 2016, category: "主题乐园", desc: "中国规模最大的高科技主题乐园之一，包含欢乐世界、梦幻王国、东方神画和水上乐园四个园区。", lat: 31.337, lng: 118.389}, {name: "六安万佛湖风景区", province: "安徽", city: "六安", year: 2016, category: "自然风光", desc: "以人工湖为主体的水利风景区，湖中有60多个岛屿。"}, {name: "马鞍山采石矶景区", province: "安徽", city: "马鞍山", year: 2020, category: "自然风光", desc: "长江三大名矶之首，因李白多次登临留下千古名篇而闻名。翠螺山临江而立，峭壁千寻。", lat: 31.642, lng: 118.439}, {name: "滁州琅琊山景区", province: "安徽", city: "滁州", year: 2024, category: "自然风光", desc: "醉翁之意不在酒，欧阳修《醉翁亭记》诞生地。"}, {name: "厦门鼓浪屿风景名胜区", province: "福建", city: "厦门", year: 2007, category: "文化遗产", desc: "“海上花园”鼓浪屿面积仅1.91平方公里，却汇集了不同风格的建筑，被称为“万国建筑博览”。2017年列入世界文化遗产。", lat: 24.447, lng: 118.064}, {name: "南平武夷山风景名胜区", province: "福建", city: "南平", year: 2007, category: "自然与文化双遗产", desc: "世界自然与文化双遗产，中国丹霞地貌的典型代表。武夷山是朱子理学的发源地，大红袍的原产地。", lat: 27.718, lng: 117.957}, {name: "三明泰宁风景旅游区", province: "福建", city: "三明", year: 2011, category: "自然风光", desc: "福建三明国家5A级旅游景区。"}, {name: "福建土楼（永定·南靖）旅游景区", province: "福建", city: "龙岩", year: 2011, category: "文化遗产", desc: "世界文化遗产，是中国传统民居建筑的奇葩。土楼以生土夯筑，兼具防御和居住功能，被誉为“东方古城堡”。", lat: 24.654, lng: 116.973}, {name: "宁德白水洋-鸳鸯溪旅游区", province: "福建", city: "宁德", year: 2012, category: "自然风光", desc: "拥有世界唯一的“浅水广场”——平底基岩河床。鸳鸯溪是中国唯一的鸳鸯猕猴自然保护区。", lat: 26.927, lng: 119.051}, {name: "泉州清源山风景名胜区", province: "福建", city: "泉州", year: 2012, category: "自然风光", desc: "泉州十八景之一，以老君岩最负盛名。老君岩是中国现存最大的道教石雕造像。", lat: 24.908, lng: 118.593}, {name: "宁德太姥山旅游区", province: "福建", city: "宁德", year: 2013, category: "自然风光", desc: "海上仙都，以花岗岩峰林岩洞著称。"}, {name: "福州三坊七巷景区", province: "福建", city: "福州", year: 2015, category: "文化遗产", desc: "中国都市仅存的一块“里坊制度活化石”，自晋、唐形成起，便是贵族和士大夫的聚居地。走出了林则徐、严复等大量历史名人。", lat: 26.084, lng: 119.291}, {name: "龙岩古田旅游区", province: "福建", city: "龙岩", year: 2015, category: "红色旅游", desc: "中国共产党建军史上的里程碑，1929年古田会议在此召开，确立了“思想建党、政治建军”的原则。", lat: 25.225, lng: 116.82}, {name: "莆田湄洲岛妈祖文化旅游区", province: "福建", city: "莆田", year: 2020, category: "文化遗产", desc: "妈祖文化的发源地，全世界妈祖信众的朝圣中心。"}, {name: "厦门园林植物园景区", province: "福建", city: "厦门", year: 2024, category: "园林景观", desc: "万石植物园，汇集热带亚热带植物6000多种。"}, {name: "龙岩冠豸山景区", province: "福建", city: "龙岩", year: 2024, category: "自然风光", desc: "以丹霞地貌和客家文化著称。"}, {name: "九江庐山风景名胜区", province: "江西", city: "九江", year: 2007, category: "自然与文化双遗产", desc: "“不识庐山真面目，只缘身在此山中”。以雄、奇、险、秀闻名，素有“匡庐奇秀甲天下”之誉。", lat: 29.558, lng: 115.983}, {name: "吉安井冈山风景旅游区", province: "江西", city: "吉安", year: 2007, category: "红色旅游", desc: "中国革命的摇篮，创建了中国第一个农村革命根据地。以“革命摇篮”和“绿色宝库”闻名于世。", lat: 26.568, lng: 114.147}, {name: "上饶三清山风景名胜区", province: "江西", city: "上饶", year: 2011, category: "自然风光", desc: "世界自然遗产，以“奇峰怪石、古树名花、流泉飞瀑、云海雾涛”四绝著称。是道教名山，因玉京、玉虚、玉华三峰宛如道教三清而得名。", lat: 28.942, lng: 118.05}, {name: "鹰潭龙虎山风景名胜区", province: "江西", city: "鹰潭", year: 2012, category: "自然与文化双遗产", desc: "中国道教发源地，天师道祖庭。以丹霞地貌和古越族崖墓群闻名，“丹霞绝美、道教祖庭、古越之谜”三大特色。", lat: 28.055, lng: 116.958}, {name: "上饶婺源江湾景区", province: "江西", city: "上饶", year: 2013, category: "文化遗产", desc: "“中国最美乡村”婺源的代表景区，以徽派古村落和油菜花闻名。保存了大量明清古建筑。", lat: 29.308, lng: 117.955}, {name: "景德镇古窑民俗博览区", province: "江西", city: "景德镇", year: 2013, category: "文化遗产", desc: "“千年瓷都”景德镇的核心景区，展示古代制瓷工艺。有历代古窑，可观赏手工制瓷全过程。", lat: 29.278, lng: 117.207}, {name: "赣州瑞金共和国摇篮景区", province: "江西", city: "赣州", year: 2015, category: "红色旅游", desc: "中华苏维埃共和国临时中央政府诞生地，被称为“红色故都”。瑞金是举世闻名的二万五千里长征出发地。", lat: 25.876, lng: 116.026}, {name: "宜春明月山旅游区", province: "江西", city: "宜春", year: 2015, category: "自然风光", desc: "以“奇峰险壑、温泉飞瀑、珍稀动植物和禅宗文化”为主要特色。富硒温泉闻名遐迩。", lat: 27.668, lng: 114.372}, {name: "抚州大觉山景区", province: "江西", city: "抚州", year: 2017, category: "自然风光", desc: "以“深山藏古寺、峡谷飘玉带”闻名。大觉山漂流全长3.6公里，落差188米，被誉为“亚洲第一漂”。", lat: 27.481, lng: 116.825}, {name: "上饶龟峰景区", province: "江西", city: "上饶", year: 2017, category: "自然风光", desc: "以丹霞地貌著称，无山不龟，无石不龟。"}, {name: "南昌滕王阁旅游区", province: "江西", city: "南昌", year: 2018, category: "文化遗产", desc: "江西南昌国家5A级旅游景区。"}, {name: "萍乡武功山景区", province: "江西", city: "萍乡", year: 2019, category: "自然风光", desc: "以高山草甸著称，户外徒步和露营热门目的地。"}, {name: "九江庐山西海景区", province: "江西", city: "九江", year: 2020, category: "自然风光", desc: "柘林湖大坝拦蓄修河而成的人工湖。"}, {name: "赣州三百山景区", province: "江西", city: "赣州", year: 2022, category: "自然风光", desc: "东江源头，以原始森林和温泉著称。"}, {name: "上饶篁岭景区", province: "江西", city: "上饶", year: 2024, category: "文化遗产", desc: "以晒秋民俗闻名的古村落。"}, {name: "泰安泰山风景名胜区", province: "山东", city: "泰安", year: 2007, category: "自然与文化双遗产", desc: "五岳之首，世界自然与文化双遗产。“会当凌绝顶，一览众山小”。泰山自古以来就是中国最著名的山岳之一。", lat: 36.256, lng: 117.101}, {name: "烟台蓬莱阁-三仙山-八仙过海旅游区", province: "山东", city: "烟台", year: 2007, category: "文化遗产", desc: "山东烟台国家5A级旅游景区。"}, {name: "济宁曲阜明故城（三孔）旅游区", province: "山东", city: "济宁", year: 2007, category: "文化遗产", desc: "孔庙、孔府、孔林合称“三孔”，是中国历代纪念孔子、推崇儒学的表征。以丰厚的文化积淀、悠久的历史著称。", lat: 35.596, lng: 116.986}, {name: "青岛崂山景区", province: "山东", city: "青岛", year: 2011, category: "自然风光", desc: "“泰山虽云高，不如东海崂”。崂山是中国海岸线上的最高峰，有“海上名山第一”之称，道教名山。", lat: 36.166, lng: 120.62}, {name: "威海刘公岛景区", province: "山东", city: "威海", year: 2011, category: "文化遗产", desc: "北洋水师的诞生地和甲午战争的主战场。有“不沉的战舰”之称，是中国近代海军的摇篮和甲午战争纪念地。", lat: 37.507, lng: 122.145}, {name: "烟台龙口南山景区", province: "山东", city: "烟台", year: 2011, category: "文化遗产", desc: "以历史文化为底蕴，集宗教文化、历史文化、滨海文化于一体。南山大佛高38.66米，是世界上最大的锡青铜坐佛。", lat: 37.643, lng: 120.478}, {name: "济南天下第一泉景区", province: "山东", city: "济南", year: 2013, category: "自然风光", desc: "以趵突泉为核心，“泉城”济南的标志性景观。趵突泉位列济南七十二名泉之首，被誉为“天下第一泉”。", lat: 36.661, lng: 117.009}, {name: "枣庄台儿庄古城景区", province: "山东", city: "枣庄", year: 2013, category: "文化遗产", desc: "“天下第一庄”，因台儿庄大战闻名中外。古城重建后保留了大战遗迹，是京杭大运河沿线最后一座“活着的古城”。", lat: 34.554, lng: 117.708}, {name: "沂蒙山景区", province: "山东", city: "临沂", year: 2013, category: "自然风光", desc: "世界著名养生长寿圣地，以蒙山和沂山为主体。蒙山主峰龟蒙顶海拔1156米，为山东第二高峰。", lat: 35.535, lng: 117.859}, {name: "潍坊青州古城景区", province: "山东", city: "潍坊", year: 2017, category: "文化遗产", desc: "古九州之一，有7000余年的发展史。城内保存了大量古建筑，有“海岱惟青州”之美誉。", lat: 36.684, lng: 118.478}, {name: "威海华夏城景区", province: "山东", city: "威海", year: 2017, category: "主题乐园", desc: "以展示东方古典文化为主的大型文化景区。由矿坑生态修复而成，被誉为“矿坑上的华夏城”。", lat: 37.43, lng: 122.145}, {name: "东营黄河口生态旅游区", province: "山东", city: "东营", year: 2019, category: "自然风光", desc: "黄河入海口湿地，新生湿地和野生鸟类天堂。"}, {name: "临沂萤火虫水洞·地下大峡谷旅游区", province: "山东", city: "临沂", year: 2020, category: "自然风光", desc: "以萤火虫水洞和地下大峡谷闻名。"}, {name: "济宁微山湖旅游区", province: "山东", city: "济宁", year: 2022, category: "自然风光", desc: "中国北方最大淡水湖，以铁道游击队的故事和万亩荷花著称。"}, {name: "青岛奥帆海洋文化旅游区", province: "山东", city: "青岛", year: 2024, category: "现代建筑", desc: "2008年北京奥运会帆船比赛场地，以奥帆中心为核心，结合海洋文化和青岛特色。", lat: 36.056, lng: 120.393}, {name: "淄博周村古商城景区", province: "山东", city: "淄博", year: 2024, category: "文化遗产", desc: "中国活着的古商业建筑博物馆。"}, {name: "郑州嵩山少林景区", province: "河南", city: "郑州", year: 2007, category: "文化遗产", desc: "河南郑州国家5A级旅游景区。"}, {name: "洛阳龙门石窟", province: "河南", city: "洛阳", year: 2007, category: "文化遗产", desc: "世界文化遗产，中国四大石窟之一。始凿于北魏孝文帝年间，现存窟龛2345个，造像10万余尊，碑刻题记2800余品。", lat: 34.568, lng: 112.468}, {name: "焦作云台山-神农山-青天河风景名胜区", province: "河南", city: "焦作", year: 2007, category: "自然风光", desc: "以云台山世界地质公园为主体，拥有亚洲最高落差瀑布——云台天瀑（落差314米）。红石峡丹崖碧水，堪称一绝。", lat: 35.235, lng: 113.366}, {name: "安阳殷墟景区", province: "河南", city: "安阳", year: 2011, category: "文化遗产", desc: "中国商代晚期的都城遗址，是中国历史上第一个有文献可考、并为考古学和甲骨文所证实的都城。", lat: 36.108, lng: 114.314}, {name: "洛阳白云山景区", province: "河南", city: "洛阳", year: 2011, category: "自然风光", desc: "位于伏牛山腹地，海拔1500米以上的山峰37座。白云山有“中国最美的地方”之称。", lat: 33.677, lng: 111.795}, {name: "开封清明上河园", province: "河南", city: "开封", year: 2011, category: "主题乐园", desc: "以宋代张择端名画《清明上河图》为蓝本的大型宋代文化主题公园。再现了汴京的繁华盛景。", lat: 34.818, lng: 114.339}, {name: "平顶山尧山-中原大佛景区", province: "河南", city: "平顶山", year: 2011, category: "自然风光", desc: "尧山以温泉和原始森林著称，中原大佛高208米。"}, {name: "洛阳老君山-鸡冠洞旅游区", province: "河南", city: "洛阳", year: 2012, category: "自然风光", desc: "道教名山，传为老子归隐修炼之地。"}, {name: "洛阳龙潭大峡谷景区", province: "河南", city: "洛阳", year: 2013, category: "自然风光", desc: "以红岩嶂谷群地质地貌著称。"}, {name: "南阳西峡恐龙遗迹园-老界岭旅游区", province: "河南", city: "南阳", year: 2014, category: "自然风光", desc: "河南南阳国家5A级旅游景区。"}, {name: "驻马店嵖岈山旅游景区", province: "河南", city: "驻马店", year: 2015, category: "自然风光", desc: "河南驻马店国家5A级旅游景区。"}, {name: "安阳红旗渠-太行大峡谷旅游景区", province: "河南", city: "安阳", year: 2016, category: "红色旅游", desc: "河南安阳国家5A级旅游景区。"}, {name: "商丘芒砀山汉文化旅游景区", province: "河南", city: "商丘", year: 2017, category: "文化遗产", desc: "以汉代梁国王陵墓群和刘邦斩蛇起义传说著称。"}, {name: "新乡八里沟景区", province: "河南", city: "新乡", year: 2019, category: "自然风光", desc: "太行山水之精华，以“北方水世界，太行山水魂”著称。八里沟瀑布落差180米，是太行山区落差最大的瀑布。", lat: 35.577, lng: 113.603}, {name: "信阳鸡公山景区", province: "河南", city: "信阳", year: 2022, category: "自然风光", desc: "中国四大避暑胜地之一，位于大别山北麓。鸡公山报晓峰形如雄鸡报晓，故名鸡公山。", lat: 31.787, lng: 114.078}, {name: "周口太昊伏羲陵文化旅游区", province: "河南", city: "周口", year: 2024, category: "文化遗产", desc: "三皇之首太昊伏羲氏的陵庙，天下第一陵。"}, {name: "新乡宝泉旅游区", province: "河南", city: "新乡", year: 2024, category: "自然风光", desc: "以碧水丹崖著称。"}, {name: "武汉黄鹤楼公园", province: "湖北", city: "武汉", year: 2007, category: "文化遗产", desc: "“故人西辞黄鹤楼，烟花三月下扬州”。江南三大名楼之首，始建于三国时期。", lat: 30.544, lng: 114.302}, {name: "宜昌三峡大坝-屈原故里旅游区", province: "湖北", city: "宜昌", year: 2007, category: "现代建筑", desc: "世界最大的水利枢纽工程，坝顶高程185米，坝长2309.5米。屈原故里展示了楚文化。", lat: 30.823, lng: 111.003}, {name: "宜昌三峡人家风景区", province: "湖北", city: "宜昌", year: 2011, category: "自然风光", desc: "以三峡民俗文化和自然风光为主题。"}, {name: "十堰武当山风景名胜区", province: "湖北", city: "十堰", year: 2011, category: "自然与文化双遗产", desc: "中国道教圣地，太极拳的发源地。以“五岳之冠”闻名于世，古建筑群被列入世界文化遗产。", lat: 32.4, lng: 111.004}, {name: "恩施神农溪纤夫文化旅游区", province: "湖北", city: "恩施", year: 2011, category: "自然风光", desc: "以纤夫拉纤和峡谷风光著称。"}, {name: "神农架生态旅游区", province: "湖北", city: "神农架", year: 2012, category: "自然风光", desc: "中国唯一以“林区”命名的行政区，以原始森林、金丝猴和“野人”之谜闻名。世界自然遗产地。", lat: 31.553, lng: 110.578}, {name: "武汉东湖生态旅游风景区", province: "湖北", city: "武汉", year: 2013, category: "自然风光", desc: "湖北武汉国家5A级旅游景区。"}, {name: "宜昌清江画廊景区", province: "湖北", city: "宜昌", year: 2013, category: "自然风光", desc: "“八百里清江美如画，三百里画廊在长阳”。清江是土家族的母亲河，沿途风光如画。", lat: 30.469, lng: 111.192}, {name: "武汉木兰文化生态旅游区", province: "湖北", city: "武汉", year: 2014, category: "文化遗产", desc: "以木兰文化为主题的综合性旅游区。"}, {name: "恩施大峡谷景区", province: "湖北", city: "恩施", year: 2015, category: "自然风光", desc: "被誉为“东方科罗拉多”，全长108公里。以“雄、奇、秀、幽、险”著称，有“一炷香”等标志性景观。", lat: 30.452, lng: 109.403}, {name: "咸宁三国赤壁古战场景区", province: "湖北", city: "咸宁", year: 2018, category: "文化遗产", desc: "湖北咸宁国家5A级旅游景区。"}, {name: "襄阳古隆中景区", province: "湖北", city: "襄阳", year: 2019, category: "文化遗产", desc: "三顾茅庐和隆中对的发生地。"}, {name: "恩施腾龙洞景区", province: "湖北", city: "恩施", year: 2020, category: "自然风光", desc: "世界特级溶洞之一。"}, {name: "宜昌三峡大瀑布景区", province: "湖北", city: "宜昌", year: 2022, category: "自然风光", desc: "三峡地区最大的瀑布。"}, {name: "荆门明显陵文化旅游景区", province: "湖北", city: "荆门", year: 2024, category: "文化遗产", desc: "湖北荆门国家5A级旅游景区。"}, {name: "黄冈麻城龟峰山景区", province: "湖北", city: "黄冈", year: 2024, category: "自然风光", desc: "以杜鹃花海闻名。"}, {name: "张家界武陵源-天门山旅游区", province: "湖南", city: "张家界", year: 2007, category: "自然风光", desc: "世界自然遗产，以独特的石英砂岩峰林地貌闻名。“三千翠微峰，八百琉璃水”，《阿凡达》取景地。天门山有世界最长高山客运索道。", lat: 29.317, lng: 110.478}, {name: "衡阳南岳衡山旅游区", province: "湖南", city: "衡阳", year: 2007, category: "自然与文化双遗产", desc: "五岳之南岳，以“五岳独秀”、“中华寿岳”著称。祝融峰海拔1300.2米，为南岳最高峰。", lat: 27.277, lng: 112.723}, {name: "湘潭韶山旅游区", province: "湖南", city: "湘潭", year: 2011, category: "红色旅游", desc: "毛泽东同志的故乡，中国四大革命纪念地之一。毛泽东故居、滴水洞等景点每年吸引数百万游客。", lat: 27.913, lng: 112.527}, {name: "岳阳岳阳楼-君山岛景区", province: "湖南", city: "岳阳", year: 2011, category: "文化遗产", desc: "湖南岳阳国家5A级旅游景区。"}, {name: "长沙岳麓山-橘子洲旅游区", province: "湖南", city: "长沙", year: 2012, category: "自然风光", desc: "岳麓山是南岳衡山72峰之尾峰，“停车坐爱枫林晚”之地。橘子洲是湘江中的冲积沙洲，毛泽东青年艺术雕塑矗立于此。", lat: 28.181, lng: 112.939}, {name: "长沙花明楼景区", province: "湖南", city: "长沙", year: 2013, category: "红色旅游", desc: "刘少奇同志的故居所在地，全国重点文物保护单位。", lat: 28.009, lng: 112.603}, {name: "郴州东江湖旅游区", province: "湖南", city: "郴州", year: 2015, category: "自然风光", desc: "“人间天上一湖水，万千景象在其中”。东江湖水质清澈，小东江晨雾如仙境，有“湘南洞庭”之称。", lat: 25.796, lng: 113.296}, {name: "邵阳崀山景区", province: "湖南", city: "邵阳", year: 2016, category: "自然风光", desc: "中国丹霞地貌的代表，世界自然遗产。以“丹霞之魂，国之瑰宝”著称，辣椒峰、天一巷为标志性景观。", lat: 26.377, lng: 110.824}, {name: "株洲炎帝陵景区", province: "湖南", city: "株洲", year: 2019, category: "文化遗产", desc: "中华民族始祖炎帝神农氏的陵寝。"}, {name: "常德桃花源旅游区", province: "湖南", city: "常德", year: 2020, category: "自然风光", desc: "陶渊明桃花源记原型地。"}, {name: "湘西矮寨·十八洞·德夯大峡谷景区", province: "湖南", city: "湘西", year: 2021, category: "自然风光", desc: "矮寨大桥是世界跨峡谷最大的钢桁梁悬索桥。十八洞村是“精准扶贫”首倡地。", lat: 28.367, lng: 109.593}, {name: "湘西凤凰古城旅游区", province: "湖南", city: "湘西", year: 2024, category: "文化遗产", desc: "中国最美小城，以苗族文化和吊脚楼建筑闻名。"}, {name: "广州长隆旅游度假区", province: "广东", city: "广州", year: 2007, category: "主题乐园", desc: "中国最受欢迎的旅游度假区之一，包含长隆欢乐世界、长隆野生动物世界、长隆水上乐园等。", lat: 23.003, lng: 113.325}, {name: "深圳华侨城旅游度假区", province: "广东", city: "深圳", year: 2007, category: "主题乐园", desc: "包含世界之窗、锦绣中华、欢乐谷、东部华侨城等主题公园，是中国最具规模的文化旅游区之一。", lat: 22.532, lng: 113.98}, {name: "广州白云山风景区", province: "广东", city: "广州", year: 2011, category: "自然风光", desc: "“羊城第一秀”，由30多座山峰组成，主峰摩星岭海拔382米。是广州的“市肺”。", lat: 23.167, lng: 113.295}, {name: "梅州雁南飞茶田景区", province: "广东", city: "梅州", year: 2011, category: "自然风光", desc: "以茶文化为主题的生态旅游区，茶园面积达数千亩。群山环抱，茶田叠翠。", lat: 24.269, lng: 116.17}, {name: "深圳观澜湖休闲旅游区", province: "广东", city: "深圳", year: 2011, category: "主题乐园", desc: "世界最大的高尔夫球会。"}, {name: "清远连州地下河景区", province: "广东", city: "清远", year: 2011, category: "自然风光", desc: "中国最长的地下河溶洞之一，暗河全长1500米。洞内钟乳石千姿百态，“地下银河”名不虚传。", lat: 24.775, lng: 112.376}, {name: "韶关丹霞山景区", province: "广东", city: "韶关", year: 2012, category: "自然风光", desc: "世界自然遗产，丹霞地貌的命名地。以“色如渥丹，灿若明霞”的赤壁丹崖著称。", lat: 24.995, lng: 113.676}, {name: "佛山西樵山景区", province: "广东", city: "佛山", year: 2013, category: "自然风光", desc: "广东四大名山之一，以火山地貌和观音文化闻名。南海观音像高61.9米，是世界上最高的观音坐像。", lat: 22.932, lng: 112.963}, {name: "惠州罗浮山景区", province: "广东", city: "惠州", year: 2013, category: "自然风光", desc: "“岭南第一山”，道教十大洞天之第七洞天。葛洪在此炼丹著书，是中国道教名山。", lat: 23.257, lng: 114.008}, {name: "佛山长鹿旅游休博园", province: "广东", city: "佛山", year: 2014, category: "主题乐园", desc: "以岭南水乡文化为主题的旅游景区。"}, {name: "阳江海陵岛大角湾海上丝路旅游区", province: "广东", city: "阳江", year: 2015, category: "自然风光", desc: "“南海一号”古  desc: "亚洲第五座迪士尼乐园，包含美国小镇大街、幻想世界、明日世界等主题园区。", lat: 22.313, lng: 114.042}];
const categories=[...new Set(spots.map(s=>s.category))].sort();
const provinces=[...new Set(spots.map(s=>s.province))].sort();
const years=[...new Set(spots.map(s=>s.year))].sort((a,b)=>b-a);

const filterProvince=document.getElementById('filterProvince');
const filterCategory=document.getElementById('filterCategory');
const filterYear=document.getElementById('filterYear');
const searchInput=document.getElementById('searchInput');
const grid=document.getElementById('grid');
const resultInfo=document.getElementById('resultInfo');
const noResult=document.getElementById('noResult');
const paginationEl=document.getElementById('pagination');

provinces.forEach(p=>{const o=document.createElement('option');o.value=p;o.textContent=p;filterProvince.appendChild(o)});
categories.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;filterCategory.appendChild(o)});
years.forEach(y=>{const o=document.createElement('option');o.value=y;o.textContent=y+'年';filterYear.appendChild(o)});

document.getElementById('totalCount').textContent=spots.length;
document.getElementById('provinceCount').textContent=provinces.length;
document.getElementById('categoryCount').textContent=categories.length;
document.getElementById('yearSpan').textContent=years[years.length-1]+'-'+years[0];

const ITEMS_PER_PAGE=20;
let currentPage=1;

function getFiltered(){
  const pv=filterProvince.value,ct=filterCategory.value,yr=filterYear.value,sw=searchInput.value.trim().toLowerCase();
  return spots.filter(s=>{
    if(pv&&s.province!==pv)return false;
    if(ct&&s.category!==ct)return false;
    if(yr&&s.year!==parseInt(yr))return false;
    if(sw&&!s.name.toLowerCase().includes(sw)&&!s.city.toLowerCase().includes(sw)&&!s.province.toLowerCase().includes(sw)&&!s.desc.toLowerCase().includes(sw))return false;
    return true;
  });
}

const imgColors=['#e8d5b7','#b7d5e8','#d5e8b7','#e8b7d5','#b7e8d5','#d5b7e8','#c5d8e8','#e8c5b7','#b7c5e8','#e8e5b7'];
function getImgBg(spot){
  const idx=(spot.name.charCodeAt(0)+spot.name.length)%imgColors.length;
  return `linear-gradient(135deg,${imgColors[idx]},${imgColors[(idx+3)%imgColors.length]})`;
}

function getAmapUrl(spot){
  if(spot.lat&&spot.lng){
    return `https://uri.amap.com/marker?position=${spot.lng},${spot.lat}&name=${encodeURIComponent(spot.name)}`;
  }
  return `https://uri.amap.com/search?keyword=${encodeURIComponent(spot.name+' '+spot.city)}`;
}

function renderCard(spot,i){
  const idx=spots.indexOf(spot);
  const imgHtml=spot.img
    ? `<img src="${spot.img}" alt="${spot.name}" loading="lazy" onerror="this.style.display='none'">`
    : '';
  return `<div class="card" onclick="openModal(${idx})" role="button" tabindex="0" aria-label="查看${spot.name}详情" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openModal(${idx})}">
    <div class="card-img" style="background:${getImgBg(spot)}">${imgHtml}</div>
    <div class="card-badge">${spot.year}年入选</div>
    <div class="card-body">
      <div class="card-title">${spot.name}</div>
      <div class="card-meta">
        <span class="card-tag tag-province">${spot.province}</span>
        <span class="card-tag tag-category">${spot.category}</span>
      </div>
      <div class="card-desc">${spot.desc}</div>
    </div>
    <div class="card-footer">
      <span class="card-location">${spot.province} · ${spot.city}</span>
      <a class="card-map-btn" href="${getAmapUrl(spot)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" aria-label="在高德地图打开${spot.name}">地图</a>
      <a class="card-baike-btn" href="https://baike.baidu.com/item/${encodeURIComponent(_baikeUrls[spot.name]||spot.name)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" aria-label="在百度百科打开${spot.name}">百科</a>
    </div>
  </div>`;
}

function render(){
  const filtered=getFiltered();
  const totalPages=Math.ceil(filtered.length/ITEMS_PER_PAGE);
  if(currentPage>totalPages)currentPage=1;
  const start=(currentPage-1)*ITEMS_PER_PAGE;
  const pageItems=filtered.slice(start,start+ITEMS_PER_PAGE);

  resultInfo.innerHTML=`共找到 <strong>${filtered.length}</strong> 个景区`+(totalPages>1?`，第 ${currentPage}/${totalPages} 页`:'');
  grid.innerHTML=pageItems.map(renderCard).join('');
  noResult.style.display=filtered.length?'none':'block';

  let pg='';
  if(totalPages>1){
    pg+=`<button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>上一页</button>`;
    for(let i=1;i<=totalPages;i++){
      if(i===1||i===totalPages||(i>=currentPage-2&&i<=currentPage+2)){
        pg+=`<button class="page-btn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
      }else if(i===currentPage-3||i===currentPage+3){
        pg+='<span style="padding:8px">...</span>';
      }
    }
    pg+=`<button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage===totalPages?'disabled':''}>下一页</button>`;
  }
  paginationEl.innerHTML=pg;
}

function goPage(p){currentPage=p;render();window.scrollTo({top:300,behavior:'smooth'})}

let _galleryState={imgs:[],cur:0};

function openModal(idx){
  const s=spots[idx];
  const modalImgEl=document.getElementById('modalImg');
  // Use local gallery if available
  if(s.imgs&&s.imgs.length>1){
    _galleryState={imgs:s.imgs,cur:0};
    _renderGallery(s.name);
  }else if(s.img){
    modalImgEl.innerHTML=`<img src="${s.img}" alt="${s.name}">`;
    modalImgEl.style.background='#111';
  }else{
    modalImgEl.style.background=getImgBg(s);
    modalImgEl.innerHTML='';
  }
  modalImgEl.style.display='';
  document.getElementById('modalTitle').textContent=s.name;
  document.getElementById('modalTags').innerHTML=`<span class="card-tag tag-province">${s.province}</span><span class="card-tag tag-category">${s.category}</span><span class="card-tag tag-year">${s.year}年入选</span>`;
  document.getElementById('modalDesc').textContent=s.desc;
  document.getElementById('modalInfo').innerHTML=`
    <div class="modal-info-item"><div class="label">所在省份</div><div class="value">${s.province}</div></div>
    <div class="modal-info-item"><div class="label">所在城市</div><div class="value">${s.city}</div></div>
    <div class="modal-info-item"><div class="label">景区类别</div><div class="value">${s.category}</div></div>
    <div class="modal-info-item"><div class="label">入选年份</div><div class="value">${s.year}年</div></div>
    <div class="modal-info-item"><div class="label">地理坐标</div><div class="value">${s.lat?`${s.lat}°N, ${s.lng}°E`:'—'}</div></div>
    <div class="modal-info-item"><div class="label">景区级别</div><div class="value">国家AAAAA级</div></div>`;
  document.getElementById('modalLinks').innerHTML=`<a class="link-btn" href="https://baike.baidu.com/item/${encodeURIComponent(_baikeUrls[s.name]||s.name)}" target="_blank" rel="noopener">百度百科</a>
    <a class="link-btn map-btn" href="${getAmapUrl(s)}" target="_blank" rel="noopener">高德地图</a>`;
  document.getElementById('modal').classList.add('active');
  document.body.style.overflow='hidden';
}

function _renderGallery(name){
  const el=document.getElementById('modalImg');
  const g=_galleryState;
  if(!g.imgs.length)return;
  el.innerHTML=`<div class="modal-gallery">
    <img src="${g.imgs[g.cur]}" alt="${name}">
    ${g.imgs.length>1?`<button class="gallery-nav gallery-prev" onclick="event.stopPropagation();_galleryNav(-1)">‹</button>
    <button class="gallery-nav gallery-next" onclick="event.stopPropagation();_galleryNav(1)">›</button>
    <div class="gallery-dots">${g.imgs.map((_,i)=>`<span class="${i===g.cur?'active':''}" onclick="event.stopPropagation();_galleryGo(${i})"></span>`).join('')}</div>`:''}
    <div class="gallery-caption">${g.cur+1} / ${g.imgs.length}</div>
  </div>`;
  el.style.background='#111';
}

function _galleryNav(dir){
  const g=_galleryState;
  g.cur=(g.cur+dir+g.imgs.length)%g.imgs.length;
  _renderGallery(document.getElementById('modalTitle').textContent);
}
function _galleryGo(i){
  _galleryState.cur=i;
  _renderGallery(document.getElementById('modalTitle').textContent);
}

function closeModal(){document.getElementById('modal').classList.remove('active');document.body.style.overflow=''}
document.getElementById('modal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

let timer;function debounce(fn,delay){return function(){clearTimeout(timer);timer=setTimeout(fn,delay)}}

filterProvince.addEventListener('change',()=>{currentPage=1;render()});
filterCategory.addEventListener('change',()=>{currentPage=1;render()});
filterYear.addEventListener('change',()=>{currentPage=1;render()});
searchInput.addEventListener('input',debounce(()=>{currentPage=1;render()},300));

window.addEventListener('scroll',()=>{document.getElementById('backTop').classList.toggle('show',window.scrollY>400)});

render();
</script>
</body>
</html>
